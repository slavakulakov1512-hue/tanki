// Предпочтительная дистанция для обычного бота
const NORMAL_PREFERRED_DIST = 120;   // метров
const NORMAL_DIST_BAND      = 35;    // ±полоса вокруг предпочтительной

function updateAI(dt){
  for(const enemy of enemyTanks){
    if(enemy.userData.destroyed) continue;
    const ai = enemy.userData.ai, modules = enemy.userData.modules, type = enemy.userData.type||'tank';
    const mul = getModuleMultipliers(modules, type);
    const canMove = type==='tank' || type==='bmp' ? !modules.engine?.damaged && !modules.transmission?.damaged && !(modules.leftTrack?.damaged && modules.rightTrack?.damaged) : !modules.engine?.damaged && !(modules.wheelFL?.damaged && modules.wheelFR?.damaged && modules.wheelML?.damaged && modules.wheelMR?.damaged && modules.wheelRL?.damaged && modules.wheelRR?.damaged);
    const canShoot = (type==='tank'||type==='bmp') ? !modules.gun?.damaged && !modules.breech?.destroyed : !modules.launcher?.damaged;
    const toPlayer = playerTank.position.clone().sub(enemy.position);
    const distToPlayer = toPlayer.length();
    const canSeePlayer = enemyCanSeePlayer(enemy);
    if (canSeePlayer) shareIntelPlayerPos(playerTank.position);

    if(!ai.canShoot){ ai.reloadTimer-=dt; if(ai.reloadTimer<=0) ai.canShoot = true; }
    if (enemy.userData.alertTimer > 0) enemy.userData.alertTimer -= dt;

    if (canSeePlayer) { enemy.userData.lastKnownPlayerPos = playerTank.position.clone(); enemy.userData.lastKnownTimer = 8; }
    else if (enemy.userData.lastKnownTimer > 0) enemy.userData.lastKnownTimer -= dt;

    if (enemy.userData.alertTimer > 0 && enemy.userData.health < 60) enemy.userData.angryTimer = 10;
    if (enemy.userData.angryTimer > 0) enemy.userData.angryTimer -= dt;

    if (enemy.userData.lastHitDir) { enemy.userData.lastHitTime += dt; if (enemy.userData.lastHitTime > 8) enemy.userData.lastHitDir = null; }

    ai.changeTimer = (ai.changeTimer||0) - dt;
    if(ai.changeTimer <= 0){ ai.changeTimer = 5; ai.targetZone = pickEnemyTargetZone(enemy); }

    let desiredX, desiredZ, holdStill = false;
    const isAngry = enemy.userData.angryTimer > 0;
    const knownPos = (enemy.userData.lastKnownTimer > 0 && enemy.userData.lastKnownPlayerPos) ? enemy.userData.lastKnownPlayerPos : null;
    const intelPos = getIntelPlayerPos(20);
    const cls = enemy.userData.aiClass || 'normal';

    const _rs = enemy.userData.repairState;
    if (_rs === 'repair_all' || _rs === 'repair_mobility' || _rs === 'repair_combat') holdStill = true;
    else if (enemy.userData.alertTimer > 0 && !canSeePlayer && enemy.userData.lastHitDir) {
      if (enemy.userData.retreatTimer <= 0 && !enemy.userData.retreatTarget) {
        let bestB = null, bestD = Infinity;
        for (const b of buildings) { const d = enemy.position.distanceTo(b.pos); if (d < bestD) { bestD = d; bestB = b; } }
        if (bestB && bestD < 120) {
          const off = Math.max(bestB.bw, bestB.bd)/2 + 5;
          const hd = enemy.userData.lastHitDir;
          const tx = bestB.pos.x + hd.x * off, tz = bestB.pos.z + hd.z * off;
          enemy.userData.retreatTarget = new THREE.Vector3(tx, getHeight(tx, tz), tz);
          enemy.userData.retreatTimer = 4.0;
        }
      }
      if (enemy.userData.retreatTimer > 0) {
        enemy.userData.retreatTimer -= dt;
        if (enemy.userData.retreatTarget) { desiredX = enemy.userData.retreatTarget.x; desiredZ = enemy.userData.retreatTarget.z; }
        else holdStill = true;
      } else {
        enemy.userData.retreatTarget = null;
        if (cls === 'camper') holdStill = true;
        else if (intelPos) { desiredX = intelPos.x; desiredZ = intelPos.z; }
        else if (ai.targetZone) { desiredX = ai.targetZone.pos.x; desiredZ = ai.targetZone.pos.z; }
        else { desiredX = playerTank.position.x; desiredZ = playerTank.position.z; }
      }
    }
    // ---- ОБХОДНИК ----
    else if (cls === 'flanker') {
      if (enemy.userData.runAwayCooldown > 0) enemy.userData.runAwayCooldown -= dt;
      if (enemy.userData.runAwayTimer <= 0 &&
          enemy.userData.runAwayCooldown <= 0 &&

          const toX = anchorX - enemy.position.x, toZ = anchorZ - enemy.position.z;
          const len = Math.hypot(toX, toZ) || 1;
          const perpX = toZ / len, perpZ = -toX / len;
          const bypassOffset = 80;   // усиленный обход
          const tx = anchorX + perpX * bypassOffset * enemy.userData.bypassSide;
          const tz = anchorZ + perpZ * bypassOffset * enemy.userData.bypassSide;
          enemy.userData.bypassTarget = new THREE.Vector3(tx, getHeight(tx, tz), tz);
          enemy.userData.bypassTimer = 2.5;
        }
        desiredX = enemy.userData.bypassTarget.x;
        desiredZ = enemy.userData.bypassTarget.z;
        const dz = Math.hypot(enemy.position.x - anchorX, enemy.position.z - anchorZ);
        if (ai.targetZone && dz < ZONE_RADIUS - 3 && ai.targetZone.owner !== 'enemy') holdStill = true;
      }

          }
          if (canSeePlayer || hasIntelView) enemy.userData.camperTimer = 0;
          else {
            enemy.userData.camperTimer = (enemy.userData.camperTimer || 0) + dt;
            if (enemy.userData.camperTimer > 45) { enemy.userData.camperTimer = 0; enemy.userData.camperSpot = null; }
          }
        }
      }
    }
    // ---- ОБЫЧНЫЙ ----
    else {
      // Новая логика: держать боевую дистанцию ~120 м, стрелять на ходу.
      if (isAngry) {
        // В ярости — идём на игрока вплотную
        if (canSeePlayer) holdStill = true;
        else if (intelPos) { desiredX = intelPos.x; desiredZ = intelPos.z; }
        else if (knownPos) { desiredX = knownPos.x; desiredZ = knownPos.z; }

        const tooFar   = distToPlayer > NORMAL_PREFERRED_DIST + NORMAL_DIST_BAND;
        if (tooClose) {
          // Отходим назад, но чуть по дуге, чтобы не пятиться
          const sideOffset = enemy.userData.bypassSide || (enemy.userData.bypassSide = (Math.random() > 0.5 ? 1 : -1));
          const perpX = -dirFromPlayerZ * sideOffset, perpZ = dirFromPlayerX * sideOffset;
          desiredX = enemy.position.x + dirFromPlayerX * 25 + perpX * 15;
          desiredZ = enemy.position.z + dirFromPlayerZ * 25 + perpZ * 15;
        } else if (tooFar) {
          // Подходим
          desiredX = playerTank.position.x + dirFromPlayerX * NORMAL_PREFERRED_DIST;
          desiredZ = playerTank.position.z + dirFromPlayerZ * NORMAL_PREFERRED_DIST;
        } else {
          // В зоне — стоим и стреляем, но чуть сдвигаемся чтобы не быть лёгкой мишенью
          const sideOffset = enemy.userData.bypassSide || (enemy.userData.bypassSide = (Math.random() > 0.5 ? 1 : -1));
          const perpX = -dirFromPlayerZ * sideOffset, perpZ = dirFromPlayerX * sideOffset;
          const strafeAmt = Math.sin(performance.now() * 0.0005) * 12;
          desiredX = enemy.position.x + perpX * strafeAmt;
          desiredZ = enemy.position.z + perpZ * strafeAmt;
        }
      } else if (enemy.userData.alertTimer > 0 && knownPos) {
        // Алерт, но потеряли из вида — идём к последней позиции
        desiredX = knownPos.x; desiredZ = knownPos.z;
      } else if (intelPos) {
        desiredX = intelPos.x; desiredZ = intelPos.z;
      } else if (ai.targetZone && knownPos) {
        let bestB = null, bestD = Infinity;
        for (const b of buildings) {
          const d = Math.hypot(b.pos.x - ai.targetZone.pos.x, b.pos.z - ai.targetZone.pos.z);
          if (d < bestD && d < ZONE_RADIUS + 15) { bestD = d; bestB = b; }
        }
        if (bestB) {
          const dxp = bestB.pos.x - knownPos.x, dzp = bestB.pos.z - knownPos.z, len = Math.hypot(dxp, dzp) || 1;
          const off = Math.max(bestB.bw, bestB.bd)/2 + 3;
          desiredX = bestB.pos.x + (dxp/len) * off;
          desiredZ = bestB.pos.z + (dzp/len) * off;
        } else {
          desiredX = ai.targetZone.pos.x; desiredZ = ai.targetZone.pos.z;
          const dz = Math.hypot(enemy.position.x - ai.targetZone.pos.x, enemy.position.z - ai.targetZone.pos.z);
          if (dz < ZONE_RADIUS - 3 && ai.targetZone.owner !== 'enemy') holdStill = true;
        }
      } else if (ai.targetZone) {
        desiredX = ai.targetZone.pos.x; desiredZ = ai.targetZone.pos.z;
        const dz = Math.hypot(enemy.position.x - ai.targetZone.pos.x, enemy.position.z - ai.targetZone.pos.z);
        if (dz < ZONE_RADIUS - 3 && ai.targetZone.owner !== 'enemy') holdStill = true;
      } else {
        desiredX = playerTank.position.x; desiredZ = playerTank.position.z;
      }
    }

    if (desiredX !== undefined && desiredZ !== undefined && !holdStill) enemy.userData.devGoal = { x: desiredX, z: desiredZ };
    else enemy.userData.devGoal = null;

    if (!ai.lastX) { ai.lastX = enemy.position.x; ai.lastZ = enemy.position.z; }
    if (ai.speed > 1) {
      const moved = Math.hypot(enemy.position.x - ai.lastX, enemy.position.z - ai.lastZ);
      const expected = Math.abs(ai.speed) * dt;
      if (moved < expected * 0.3) ai.stuckTimer = (ai.stuckTimer || 0) + dt;
      else ai.stuckTimer = 0;
    } else ai.stuckTimer = 0;
    ai.lastX = enemy.position.x; ai.lastZ = enemy.position.z;
    if (ai.stuckTimer > 0.4) { ai.detourTimer = 1.8; ai.detourDir = Math.random() > 0.5 ? 1 : -1; ai.stuckTimer = 0; }
    if (ai.detourTimer > 0) ai.detourTimer -= dt;

    const leftTrackBroken  = (type === 'tank' || type === 'bmp') && (modules.leftTrack?.damaged || modules.leftTrack?.destroyed);
    const rightTrackBroken = (type === 'tank' || type === 'bmp') && (modules.rightTrack?.damaged || modules.rightTrack?.destroyed);
    const oneTrackBroken   = leftTrackBroken !== rightTrackBroken;

    if(!holdStill){
      const dx = desiredX - enemy.position.x, dz2 = desiredZ - enemy.position.z;
      const distToDest = Math.hypot(dx, dz2);
      if(distToDest > 5){
        const maxSpeed = type==='ptur'? 24 : (type==='bmp'? 18 : 12);
        let targetSpeed = maxSpeed * mul.speedMul;
        if(!canMove) targetSpeed = 0;
        ai.speed += (targetSpeed - ai.speed) * dt * 3;
        if(canMove && !oneTrackBroken){
          let targetHull = Math.atan2(dx, dz2);
          if (ai.detourTimer > 0) targetHull += ai.detourDir * 1.1;
          let d = targetHull - ai.hullYaw; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
          ai.hullYaw += d * Math.min(dt*2.5*mul.turnMul, 1);
        }
      } else ai.speed *= Math.exp(-4*dt);
    } else ai.speed *= Math.exp(-4*dt);

    if(oneTrackBroken && ai.speed > 0.5){
      ai.arcTimer = (ai.arcTimer || 0) + dt;
      const arcSign = (leftTrackBroken ? -1 : 1);
      const omega = Math.min(Math.abs(ai.speed) / 2.5, 2.5);
      ai.hullYaw += arcSign * omega * dt;
      if(ai.arcTimer > 6) { enemy.userData.repairState = 'repairing'; enemy.userData.repairTimer = 0; ai.speed = 0; ai.arcTimer = 0; }
    } else ai.arcTimer = 0;

    if(canMove && ai.speed !== 0){
      const moveX = Math.sin(ai.hullYaw)*ai.speed, moveZ = Math.cos(ai.hullYaw)*ai.speed;
      enemy.position.x += moveX*dt; enemy.position.z += moveZ*dt; enemy.position.y = getHeight(enemy.position.x, enemy.position.z);
    }
    const normal = getNormal(enemy.position.x, enemy.position.z, 0.5);
    const desiredForward = new THREE.Vector3(Math.sin(ai.hullYaw), 0, Math.cos(ai.hullYaw)).normalize();
    const right = new THREE.Vector3().crossVectors(normal, desiredForward).normalize();
    const actualForward = new THREE.Vector3().crossVectors(right, normal).normalize();
    const m4 = new THREE.Matrix4(); m4.makeBasis(right, normal, actualForward);
    enemy.userData.hullGroup.quaternion.setFromRotationMatrix(m4);

    let targetYaw, followHull = false;
    if (canSeePlayer) {
      const playerVel = new THREE.Vector3(Math.sin(playerState.hullYaw)*playerState.speed, 0, Math.cos(playerState.hullYaw)*playerState.speed);
      const timeToTarget = distToPlayer / 200;
      const predictedPos = playerTank.position.clone().add(playerVel.clone().multiplyScalar(timeToTarget));
      targetYaw = Math.atan2(predictedPos.x - enemy.position.x, predictedPos.z - enemy.position.z);
    } else if (enemy.userData.alertTimer > 0 && enemy.userData.lastHitDir) {
      const hd = enemy.userData.lastHitDir;
      targetYaw = Math.atan2(hd.x, hd.z);
    } else if (intelPos && (enemy.userData.repairState || 'idle') !== 'idle') {
      targetYaw = Math.atan2(intelPos.x - enemy.position.x, intelPos.z - enemy.position.z);
    } else if (cls === 'camper' && intelPos) {
      targetYaw = Math.atan2(intelPos.x - enemy.position.x, intelPos.z - enemy.position.z);
    } else { targetYaw = ai.hullYaw; followHull = true; }
    if (followHull) ai.turretYaw = ai.hullYaw;

    let td = targetYaw - ai.turretYaw;
    while(td>Math.PI)td-=2*Math.PI; while(td<-Math.PI)td+=2*Math.PI;
    if (followHull) td = 0;

    const turretDisabled = (type==='tank'||type==='bmp') ? (modules.turretTraverse?.destroyed || modules.turretTraverse?.damaged) : (modules.launcher?.destroyed || modules.launcher?.damaged);
    if(turretDisabled){
      if(enemy.userData.turretFixedOffset===null) enemy.userData.turretFixedOffset = ai.turretYaw - ai.hullYaw;
      ai.turretYaw = ai.hullYaw + enemy.userData.turretFixedOffset;
    } else { enemy.userData.turretFixedOffset = null; ai.turretYaw += td * Math.min(dt*6*mul.turretRotMul, 1); }
    enemy.userData.turretGroup.rotation.set(0, ai.turretYaw - ai.hullYaw, 0);

    const gunDisabled = (type==='tank'||type==='bmp') ? (modules.gunElevation?.destroyed || modules.gunElevation?.damaged) : (modules.launcher?.destroyed || modules.launcher?.damaged);
    if((type==='tank'||type==='bmp') && !gunDisabled) {
      const enemyTurretWorldY = enemy.position.y + 1.25;
      const playerTurretY = playerTank.position.y + 1.25;
      const dy = playerTurretY - enemyTurretWorldY;
      const tp = Math.atan2(dy, Math.max(distToPlayer, 1));
      ai.gunPitch += (tp - ai.gunPitch) * dt * 4 * mul.pitchSpeedMul;
    }
    if(type==='tank'||type==='bmp') enemy.userData.gunGroup.rotation.x = -ai.gunPitch;

    if(canShoot && ai.canShoot && canSeePlayer && distToPlayer < 250 && Math.abs(td) < 0.15) shootTank(enemy, false);

    // Collisions
    const halfTankW = 1.2, halfTankD = 2.25;
    const tFwdX = Math.sin(ai.hullYaw), tFwdZ = Math.cos(ai.hullYaw);
    const tRgtX = tFwdZ, tRgtZ = -tFwdX;
    for(const b of buildings){
      const halfW = b.bw/2, halfD = b.bd/2;
      const dx = enemy.position.x - b.pos.x, dz = enemy.position.z - b.pos.z;
      const projX = Math.abs(halfTankW * tRgtX) + Math.abs(halfTankD * tFwdX);
      const projZ = Math.abs(halfTankW * tRgtZ) + Math.abs(halfTankD * tFwdZ);
      const limX = halfW + projX, limZ = halfD + projZ;
      if(Math.abs(dx) < limX && Math.abs(dz) < limZ){
        const overlapX = limX - Math.abs(dx), overlapZ = limZ - Math.abs(dz);
        if(overlapX < overlapZ) enemy.position.x += Math.sign(dx || 1) * overlapX;
        else enemy.position.z += Math.sign(dz || 1) * overlapZ;
      }
    }
    for(const t of destroyedTanks){
      const dx = enemy.position.x - t.position.x, dz = enemy.position.z - t.position.z, dd = Math.sqrt(dx*dx+dz*dz);
      if(dd < 3 && dd > 0.01){ enemy.position.x += dx/dd*(3-dd)*0.5; enemy.position.z += dz/dd*(3-dd)*0.5; }
    }
    {
      const dx = enemy.position.x - playerTank.position.x, dz = enemy.position.z - playerTank.position.z, dd = Math.sqrt(dx*dx + dz*dz);
      const minDist = 4.8;
      if(dd < minDist && dd > 0.01){ const push = (minDist - dd) * 0.5; enemy.position.x += (dx/dd) * push; enemy.position.z += (dz/dd) * push; enemy.position.y = getHeight(enemy.position.x, enemy.position.z); }
    }
    if(enemy.position.length() > MAP_BOUND) enemy.position.normalize().multiplyScalar(MAP_BOUND);
  }
}

// ---------- INPUT ----------
const keys = {};
let isRightMouse=false, isLeftMouse=false, isLocked=false;
let _bypassPauseOnUnlock = false;
window.addEventListener('keydown',e=>{
  if (gameState !== 'playing') return;
  const code = e.code;
  if (code === 'KeyW') keys['w'] = true;
  if (code === 'KeyS') keys['s'] = true;
  if (code === 'KeyA') keys['a'] = true;
  if (code === 'KeyD') keys['d'] = true;
  if (code === 'ArrowUp')    keys['arrowup'] = true;
  if (code === 'ArrowDown')  keys['arrowdown'] = true;
  if (code === 'ArrowLeft')  keys['arrowleft'] = true;
  if (code === 'ArrowRight') keys['arrowright'] = true;
  if (code === 'KeyE') keys['e'] = true;
  if (code === 'Numpad5') keys['numpad5'] = true;
  if (code === 'Digit5') keys['5'] = true;
  if (code === 'Space') { e.preventDefault(); returnToMenu(); }
  if (code === 'Escape') {
    e.preventDefault();
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  }
  if (code === 'NumpadMultiply') {
    e.preventDefault();
    if (gameState !== 'playing') return;
    if (document.pointerLockElement === renderer.domElement) {
      _bypassPauseOnUnlock = true;
      document.exitPointerLock();
    } else {
      renderer.domElement.requestPointerLock();
    }
  }
  if (code === 'Numpad1' || code === 'Digit2') { chillMode = !chillMode; updateChillIndicator(); }
  if (code === 'KeyQ' || code === 'Numpad2') {
    e.preventDefault();
    if (!playerState || playerState.health <= 0) return;
    if (cameraDistCoef <= 0.01) return;
    if (!isLocked) { renderer.domElement.requestPointerLock(); playerState.isZoomed = true; }
    else playerState.isZoomed = !playerState.isZoomed;
  }
  if (code === 'KeyR' && playerState && playerState.health > 0 && !playerState.canShoot && playerState.reloadTimer > 0.5) playerState.reloadTimer = 0.4;
});
window.addEventListener('keyup',e=>{
  if (gameState !== 'playing') return;
  const code = e.code;
  if (code === 'KeyW') keys['w'] = false;
  if (code === 'KeyS') keys['s'] = false;
  if (code === 'KeyA') keys['a'] = false;
  if (code === 'KeyD') keys['d'] = false;
  if (code === 'ArrowUp')    keys['arrowup'] = false;
  if (code === 'ArrowDown')  keys['arrowdown'] = false;
  if (code === 'ArrowLeft')  keys['arrowleft'] = false;
  if (code === 'ArrowRight') keys['arrowright'] = false;
  if (code === 'KeyE') keys['e'] = false;
  if (code === 'Numpad5') keys['numpad5'] = false;
  if (code === 'Digit5') keys['5'] = false;
});
window.addEventListener('mousemove',e=>{
  if(gameState !== 'playing' || !playerState) return;
  if(isLocked){
    const sens = playerState.isZoomed ? cameraSensZoom : cameraSens3rd;
    playerState.cameraYaw   -= e.movementX * 0.003 * sens;
    playerState.cameraPitch -= e.movementY * 0.003 * sens;
    playerState.cameraPitch = Math.max(-0.6, Math.min(0.4, playerState.cameraPitch));
  }
});
window.addEventListener('mousedown',e=>{
  if(gameState!=='playing'||!playerState) return;
  if(e.button===0) isLeftMouse=true;
  if(e.button===2) { isRightMouse=true; e.preventDefault(); }
});
window.addEventListener('mouseup',e=>{ if(gameState!=='playing'||!playerState) return; if(e.button===0) isLeftMouse=false; if(e.button===2) isRightMouse=false; });
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('wheel', e => { if(gameState!=='playing'||!playerState) return; if (playerState.isZoomed) playerState.zoomLevel = Math.min(5, Math.max(1, playerState.zoomLevel - Math.sign(e.deltaY)*0.5)); });
document.body.addEventListener('click', ()=>{ if (audioCtx.state === 'suspended') audioCtx.resume(); if (gameState === 'menu') startMenuMusic(); }, { once: true });
renderer.domElement.addEventListener('click', () => {
  if (gameState === 'playing' && document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  }
});
document.addEventListener('pointerlockchange', () => {
  isLocked = document.pointerLockElement === renderer.domElement;
  if(!isLocked && playerState) playerState.isZoomed = false;
  // Если pointer lock отвалился, а мы всё ещё в игре — это Esc от браузера.
  // Паузим. Но если мы сами отпустили мышь (NumpadMultiply, pauseGame,
  // returnToMenu) — не паузим.
  if (!isLocked && gameState === 'playing') {
    if (_bypassPauseOnUnlock) _bypassPauseOnUnlock = false;
    else pauseGame();
  }
});

// ---------- DAMAGE ARROWS ----------
let lastDamageTime = 0;
function showDamageDirection(direction) {
  lastDamageTime = performance.now();
  const arrows = { top: document.getElementById('arrow-top'), bottom: document.getElementById('arrow-bottom'), left: document.getElementById('arrow-left'), right: document.getElementById('arrow-right') };
  Object.values(arrows).forEach(a => a.classList.remove('show'));
  if(Math.abs(direction.x) > Math.abs(direction.z)) arrows[direction.x > 0 ? 'right' : 'left'].classList.add('show');
  else arrows[direction.z > 0 ? 'bottom' : 'top'].classList.add('show');
}
function updateDamageIndicators() { if(performance.now() - lastDamageTime > 800) lastDamageTime = 0; }

// ---------- PLAYER CONTROL ----------
function updatePlayerControls(dt){
  if(!playerState || playerState.health<=0) return;
  const modules = playerState.modules, type = playerState.vehicleType;
  const mul = getModuleMultipliers(modules, type);
  const canMove = !playerState.isRepairing && ((type==='tank'||type==='bmp')
    ? !modules.engine?.damaged && !modules.transmission?.damaged && !(modules.leftTrack?.damaged && modules.rightTrack?.damaged)
    : !modules.engine?.damaged && !(modules.wheelFL?.damaged && modules.wheelFR?.damaged && modules.wheelML?.damaged && modules.wheelMR?.damaged && modules.wheelRL?.damaged && modules.wheelRR?.damaged));
  const canShoot = (type==='tank'||type==='bmp') ? !modules.gun?.damaged && !modules.breech?.destroyed : !modules.launcher?.damaged;

  let forward = 0, strafe = 0;
  if(keys['w'] || keys['arrowup'])    forward += 1;
  if(keys['s'] || keys['arrowdown'])  forward -= 1;
  if(keys['a'] || keys['arrowleft'])  strafe  -= 1;
  if(keys['d'] || keys['arrowright']) strafe  += 1;

  const leftTrackBroken  = (type === 'tank' || type === 'bmp') && (modules.leftTrack?.damaged || modules.leftTrack?.destroyed);
  const rightTrackBroken = (type === 'tank' || type === 'bmp') && (modules.rightTrack?.damaged || modules.rightTrack?.destroyed);
  const oneTrackBroken   = leftTrackBroken !== rightTrackBroken;
  // PTUR: арк-режим только если ВСЯ сторона сломана
  const pturSide = (type === 'ptur') ? pturBrokenSide(modules) : null;
  const pturArc  = (type === 'ptur' && pturSide !== null);
  if(oneTrackBroken || pturArc) strafe = 0;

  const camDirX = Math.sin(playerState.cameraYaw);
  const camDirZ = Math.cos(playerState.cameraYaw);
  const camRightX = -camDirZ, camRightZ = camDirX;

  let moveX = camDirX * forward + camRightX * strafe;
  let moveZ = camDirZ * forward + camRightZ * strafe;
  const moveMag = Math.sqrt(moveX*moveX + moveZ*moveZ);

  const maxSpeed = type==='ptur' ? 24 : (type==='bmp' ? 18 : 12);
  if(!canMove) { moveMag && (moveX = 0, moveZ = 0); }

  if(moveMag > 0.01){
    moveX /= moveMag; moveZ /= moveMag;
    if(!oneTrackBroken && !pturArc){
      const targetHullYaw = Math.atan2(moveX, moveZ);
      let dh = targetHullYaw - playerState.hullYaw;
      while(dh >  Math.PI) dh -= 2*Math.PI;
      while(dh < -Math.PI) dh += 2*Math.PI;
      playerState.hullYaw += dh * Math.min(dt * 4, 1);
      playerState.speed = THREE.MathUtils.lerp(playerState.speed, maxSpeed * mul.speedMul, dt * 4);
      playerTank.position.x += moveX * playerState.speed * dt;
      playerTank.position.z += moveZ * playerState.speed * dt;
      playerTank.position.y = getHeight(playerTank.position.x, playerTank.position.z);
    } else {
      // Арк-режим (танк с одной гусеницей ИЛИ ПТУР с одной сломанной стороной колёс)
      playerState.speed = THREE.MathUtils.lerp(playerState.speed, maxSpeed * mul.speedMul, dt * 4);
      let arcSign;
      if (pturArc) arcSign = (pturSide === 'left' ? -1 : 1) * Math.sign(playerState.speed);
      else arcSign = (leftTrackBroken ? -1 : 1) * Math.sign(playerState.speed);
      const omega = Math.min(Math.abs(playerState.speed) / 2.5, 2.5);
      playerState.hullYaw += arcSign * omega * dt;
      const fwdX = Math.sin(playerState.hullYaw);
      const fwdZ = Math.cos(playerState.hullYaw);
      playerTank.position.x += fwdX * playerState.speed * dt;
      playerTank.position.z += fwdZ * playerState.speed * dt;
      playerTank.position.y = getHeight(playerTank.position.x, playerTank.position.z);
    }
  } else {
    playerState.speed *= Math.exp(-4 * dt);
  }

  const turretDisabled = (type==='tank'||type==='bmp') ? (modules.turretTraverse?.destroyed || modules.turretTraverse?.damaged) : (modules.launcher?.destroyed || modules.launcher?.damaged);
  if(turretDisabled){
    if(playerState.turretFixedOffset === null) playerState.turretFixedOffset = playerState.turretYaw - playerState.hullYaw;
    playerState.turretYaw = playerState.hullYaw + playerState.turretFixedOffset;
  } else {
    playerState.turretFixedOffset = null;
    let d = playerState.cameraYaw - playerState.turretYaw;
    while(d > Math.PI) d -= 2*Math.PI;
    while(d < -Math.PI) d += 2*Math.PI;
    const turretSpeed = type==='ptur' ? 4 : (type==='bmp' ? 10 : 8);
    playerState.turretYaw += d * Math.min(dt * turretSpeed * mul.turretRotMul, 1);
  }

  const gunDisabled = (type==='tank'||type==='bmp') ? (modules.gunElevation?.destroyed || modules.gunElevation?.damaged) : (modules.launcher?.destroyed || modules.launcher?.damaged);
  if(!gunDisabled){
    const pitchCoef = playerState.isZoomed ? 3 : (type==='bmp' ? 10 : 8);
    playerState.gunPitch += (playerState.cameraPitch - playerState.gunPitch) * dt * pitchCoef * mul.pitchSpeedMul;
  }
  playerState.gunPitch = Math.max(-0.65, Math.min(0.45, playerState.gunPitch));

  if (type === 'tank' && playerTank.userData.mgGroup && !playerTank.userData.mgBroken) {
    if (playerState.mgYaw === undefined)   playerState.mgYaw   = playerState.cameraYaw;
    if (playerState.mgPitch === undefined) playerState.mgPitch = playerState.cameraPitch;
    let dm = playerState.cameraYaw - playerState.mgYaw;
    while (dm >  Math.PI) dm -= 2*Math.PI;
    while (dm < -Math.PI) dm += 2*Math.PI;
    playerState.mgYaw += dm * Math.min(dt * 6, 1);
    playerState.mgPitch += (playerState.cameraPitch - playerState.mgPitch) * Math.min(dt * 6, 1);
    playerState.mgPitch = Math.max(-0.6, Math.min(0.7, playerState.mgPitch));
    const mgLocalYaw = playerState.mgYaw - playerState.turretYaw;
    const qMgYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), mgLocalYaw);
    const qMgPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -playerState.mgPitch);
    playerTank.userData.mgGroup.quaternion.copy(qMgYaw).multiply(qMgPitch);
  }

  const normal = getNormal(playerTank.position.x, playerTank.position.z, 0.5);
  const desiredForward = new THREE.Vector3(Math.sin(playerState.hullYaw), 0, Math.cos(playerState.hullYaw)).normalize();
  const right = new THREE.Vector3().crossVectors(normal, desiredForward).normalize();
  const actualForward = new THREE.Vector3().crossVectors(right, normal).normalize();
  const m4 = new THREE.Matrix4(); m4.makeBasis(right, normal, actualForward);
  playerTank.userData.hullGroup.quaternion.setFromRotationMatrix(m4);

  const hullQuat = playerTank.userData.hullGroup.quaternion;
  if (type === 'tank' || type === 'bmp') {
    playerTank.userData.turretGroup.rotation.set(0, playerState.turretYaw - playerState.hullYaw, 0);
    playerTank.userData.gunGroup.rotation.x = -playerState.gunPitch;
  } else {
    const launcherOffset = new THREE.Vector3(0, 1.5, 0).applyQuaternion(hullQuat);
    playerTank.userData.launcherGroup.position.copy(launcherOffset);
    playerTank.userData.elevGroup.position.copy(new THREE.Vector3(0,0.9,0).applyQuaternion(hullQuat));
    const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), playerState.turretYaw);
    const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -playerState.gunPitch);
    playerTank.userData.launcherGroup.quaternion.copy(qYaw).multiply(qPitch);
  }

  // Collisions
  const halfTankW = 1.2, halfTankD = 2.25;
  const tFwdX = Math.sin(playerState.hullYaw), tFwdZ = Math.cos(playerState.hullYaw);
  const tRgtX = tFwdZ, tRgtZ = -tFwdX;
  for(const b of buildings){
    const halfW = b.bw/2, halfD = b.bd/2;
    const dx = playerTank.position.x - b.pos.x, dz = playerTank.position.z - b.pos.z;
    const projX = Math.abs(halfTankW * tRgtX) + Math.abs(halfTankD * tFwdX);
    const projZ = Math.abs(halfTankW * tRgtZ) + Math.abs(halfTankD * tFwdZ);
    const limX = halfW + projX, limZ = halfD + projZ;
    if(Math.abs(dx) < limX && Math.abs(dz) < limZ){
      const overlapX = limX - Math.abs(dx), overlapZ = limZ - Math.abs(dz);
      if(overlapX < overlapZ) playerTank.position.x += Math.sign(dx || 1) * overlapX;
      else playerTank.position.z += Math.sign(dz || 1) * overlapZ;
    }
  }
  for(const t of destroyedTanks){
    const dx=playerTank.position.x-t.position.x, dz=playerTank.position.z-t.position.z, dd=Math.sqrt(dx*dx+dz*dz);
    if(dd<3 && dd>0.01){ playerTank.position.x += dx/dd*(3-dd)*0.5; playerTank.position.z += dz/dd*(3-dd)*0.5; }
  }
  {
    const minDist = 4.8;
    for(const e of enemyTanks){
      if(e.userData.destroyed) continue;
      const dx = playerTank.position.x - e.position.x, dz = playerTank.position.z - e.position.z, dd = Math.sqrt(dx*dx + dz*dz);
      if(dd < minDist && dd > 0.01){
        const push = (minDist - dd) * 0.5;
        playerTank.position.x += (dx/dd) * push; playerTank.position.z += (dz/dd) * push;
        e.position.x -= (dx/dd) * push; e.position.z -= (dz/dd) * push;
        e.position.y = getHeight(e.position.x, e.position.z);
      }
    }
  }
  if(playerTank.position.length() > MAP_BOUND) playerTank.position.normalize().multiplyScalar(MAP_BOUND);
  document.getElementById('speed-val').textContent = Math.round(Math.abs(playerState.speed)*5);

  if(type==='ptur'){
    if(playerState.cooldownTimer > 0){ playerState.cooldownTimer -= dt; if(playerState.cooldownTimer <= 0) playerState.canShoot = true; }
    if(playerState.magazineReloadTimer > 0){
      playerState.magazineReloadTimer -= dt;
      document.getElementById('reload-indicator').textContent = 'ПЕРЕЗАРЯДКА '+playerState.magazineReloadTimer.toFixed(1)+'с';
      if(playerState.magazineReloadTimer <= 0){
        const toLoad = Math.min(4, playerState.reserveAmmo + playerState.magazineCount);
        playerState.magazineCount = Math.min(4, toLoad);
        playerState.reserveAmmo = Math.max(0, playerState.reserveAmmo - (playerState.magazineCount - (playerState.magazineCount - toLoad)));
        playerState.magazineCount = Math.min(4, playerState.reserveAmmo + playerState.magazineCount);
        updateAmmoUI();
        if(playerState.magazineCount > 0) { playerState.canShoot = true; document.getElementById('reload-indicator').textContent = 'ГОТОВ'; }
        else document.getElementById('reload-indicator').textContent = 'НЕТ РАКЕТ';
      }
    }
  }

  // MG: ПКМ
  if (type === 'tank' && isRightMouse && playerTank.userData.mgGroup && !playerTank.userData.mgBroken && playerState.health > 0) {
    playerState.mgFireTimer = (playerState.mgFireTimer || 0) - dt;
    if (playerState.mgFireTimer <= 0) { playerState.mgFireTimer = 1 / 6; shootMG(playerTank); }
  } else playerState.mgFireTimer = 0;

  // LMB fire — БМП стреляет автоматически пока зажата
  if(isLeftMouse && playerState.canShoot && canShoot && playerState.health>0){
    if(playerState.vehicleType === 'tank' && playerState.ammo <= 0) document.getElementById('reload-indicator').textContent = 'НЕТ СНАРЯДОВ';
    else if(playerState.vehicleType === 'bmp' && playerState.ammo <= 0) document.getElementById('reload-indicator').textContent = 'НЕТ ПАТРОНОВ';
    else if(playerState.vehicleType === 'ptur' && playerState.magazineCount <= 0) document.getElementById('reload-indicator').textContent = 'НЕТ РАКЕТ';
    else {
      shootTank(playerTank, true);
      if (playerState.vehicleType !== 'bmp') isLeftMouse=false;
    }
  }
  if((type==='tank'||type==='bmp') && !playerState.canShoot){
    playerState.reloadTimer -= dt;
    if(playerState.reloadTimer<=0){ playerState.canShoot=true; document.getElementById('reload-indicator').textContent='ГОТОВ'; }
    else document.getElementById('reload-indicator').textContent = (type==='bmp'?'ОЧЕРЕДЬ ':'ПЕРЕЗАРЯДКА ')+playerState.reloadTimer.toFixed(2)+'с';
  }
}

// ---------- CAMERA ----------
function updateCamera(dt){
  if(!playerTank || !playerState || playerState.health <= 0) return;
  playerTank.updateMatrixWorld();
  const forceZoom = cameraDistCoef <= 0.01;
  const type = playerState.vehicleType;
  if((playerState.isZoomed || forceZoom) && playerState.health > 0){
    let sightPos, gunDir;
    if(type === 'tank' || type === 'bmp'){
      const turret = playerTank.userData.turretGroup;
      const gun = playerTank.userData.gunGroup;
      sightPos = turret.localToWorld(new THREE.Vector3(0, type==='bmp'?0.9:1.25, -0.1));
      gunDir = new THREE.Vector3(0,0,1);
      gun.localToWorld(gunDir).sub(gun.getWorldPosition(new THREE.Vector3())).normalize();
    } else {
      const launcher = playerTank.userData.launcherGroup;
      const worldPos = launcher.getWorldPosition(new THREE.Vector3());
      const forward = new THREE.Vector3(0,0,1).applyQuaternion(launcher.getWorldQuaternion(new THREE.Quaternion()));
      sightPos = worldPos.clone().add(forward.clone().multiplyScalar(0.5)).add(new THREE.Vector3(0,0.3,0));
      gunDir = forward;
    }
    camera.position.copy(sightPos);
    camera.lookAt(sightPos.clone().add(gunDir.multiplyScalar(50)));
    camera.fov = 20 / playerState.zoomLevel;
    playerTank.userData.hullGroup.visible = false;
    if(type === 'tank' || type === 'bmp'){
      const turretChildren = playerTank.userData.turretGroup.children;
      for(let i = 0; i < turretChildren.length; i++) if(turretChildren[i] !== playerTank.userData.gunGroup) turretChildren[i].visible = false;
    } else {
      const sightMesh = playerTank.userData.launcherGroup.getObjectByName('sightMesh');
      if(sightMesh) sightMesh.visible = false;
    }
  } else {
    const hullPos = playerTank.position;
    const camDist = 14 * cameraDistCoef;
    const camHeight = 7 * (0.3 + 0.7 * cameraDistCoef);
    const camDirX = Math.sin(playerState.cameraYaw), camDirZ = Math.cos(playerState.cameraYaw);
    const camPos = new THREE.Vector3(hullPos.x - camDirX * camDist, hullPos.y + camHeight, hullPos.z - camDirZ * camDist);
    camera.position.copy(camPos);
    const lookDir = new THREE.Vector3(camDirX * Math.cos(playerState.cameraPitch), Math.sin(playerState.cameraPitch), camDirZ * Math.cos(playerState.cameraPitch));
    camera.lookAt(camPos.clone().add(lookDir));
    camera.fov = 70;
    playerTank.userData.hullGroup.visible = true;
    if(type === 'tank' || type === 'bmp'){
      const turretChildren = playerTank.userData.turretGroup.children;
      for(let i = 0; i < turretChildren.length; i++){
        if(turretChildren[i] === playerTank.userData.mgGroup && playerTank.userData.mgBroken) continue;
        turretChildren[i].visible = true;
      }
    } else {
      const launchOk = !playerState.modules?.launcher?.damaged && !playerState.modules?.launcher?.destroyed;
      if(launchOk){
        const sightMesh = playerTank.userData.launcherGroup.getObjectByName('sightMesh');
        if(sightMesh) sightMesh.visible = true;
      }
    }
  }
  camera.updateProjectionMatrix();
}

const aimMarker3D = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({color: 0xff0000, transparent: true, opacity: 0.6}));
aimMarker3D.visible = false;

function update3DAimMarker(){
  const forceZoom = cameraDistCoef <= 0.01;
  if (!playerState || playerState.isZoomed || forceZoom || playerState.health <= 0) { aimMarker3D.visible = false; return; }
  aimMarker3D.visible = true;
  playerTank.updateMatrixWorld();
  const type = playerState.vehicleType;
  const gun = (type === 'tank' || type === 'bmp') ? playerTank.userData.gunGroup : playerTank.userData.launcherGroup;
  const muzzleDist = type === 'tank' ? 5.1 : (type === 'bmp' ? 2.8 : 3.0);
  const muzzle = gun.localToWorld(new THREE.Vector3(0, 0, muzzleDist));
  const dir = new THREE.Vector3(0,0,1);
  gun.localToWorld(dir).sub(gun.getWorldPosition(new THREE.Vector3())).normalize();
  aimMarker3D.position.copy(muzzle.clone().add(dir.clone().multiplyScalar(20)));
}
function updateCrosshair(){
  const ch = document.getElementById('crosshair');
  const sc = document.getElementById('scope');
  if (!ch || !sc) return;
  if (!playerTank || !playerState || playerState.health <= 0) {
    ch.style.display = 'none';
    sc.style.display = 'none';
    return;
  }
  const inScope = (playerState.isZoomed || cameraDistCoef <= 0.01);
  if (inScope) {
    ch.style.display = 'none';
    sc.style.display = '';
    const isPtur = playerState.vehicleType === 'ptur';
    document.getElementById('scope-gun').style.display  = isPtur ? 'none' : '';
    document.getElementById('scope-ptur').style.display = isPtur ? '' : 'none';
  } else {
    ch.style.display = '';
    sc.style.display = 'none';
    // Круги по viewBox 500 (центр 250,250)
    const fovRad = camera.fov * Math.PI / 180;
    const pixPerRad = 500 / fovRad;
    const gunRing = document.getElementById('gun-ring');
    const mgRing  = document.getElementById('mg-ring');

    let dYaw = playerState.turretYaw - playerState.cameraYaw;
    while (dYaw > Math.PI) dYaw -= 2 * Math.PI;
    while (dYaw < -Math.PI) dYaw += 2 * Math.PI;
    let dPitch = playerState.gunPitch - playerState.cameraPitch;
    gunRing.setAttribute('cx', 250 + dYaw * pixPerRad);
    gunRing.setAttribute('cy', 250 - dPitch * pixPerRad);

    if (playerState.vehicleType === 'tank' && playerTank.userData.mgGroup && !playerTank.userData.mgBroken) {
      mgRing.style.display = '';
      let dmYaw = (playerState.mgYaw !== undefined ? playerState.mgYaw : playerState.cameraYaw) - playerState.cameraYaw;
      while (dmYaw > Math.PI) dmYaw -= 2 * Math.PI;
      while (dmYaw < -Math.PI) dmYaw += 2 * Math.PI;
      let dmPitch = (playerState.mgPitch !== undefined ? playerState.mgPitch : playerState.cameraPitch) - playerState.cameraPitch;
      mgRing.setAttribute('cx', 250 + dmYaw * pixPerRad);
      mgRing.setAttribute('cy', 250 - dmPitch * pixPerRad);
    } else {
      mgRing.style.display = 'none';
    }
  }
}
function playerCanSeeEnemy(enemy) {
  if (!playerTank || playerState.health <= 0) return false;
  const dx = enemy.position.x - playerTank.position.x, dz = enemy.position.z - playerTank.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist > 400) return false;
  const cosA = Math.sin(playerState.cameraYaw)*dx/(dist||1) + Math.cos(playerState.cameraYaw)*dz/(dist||1);
  const fovHalf = (70 * Math.PI / 180) / 2;
  if (Math.acos(Math.max(-1, Math.min(1, cosA))) > fovHalf) return false;
  return hasLineOfSight(playerTank.position, enemy.position, true);
}
function updateMinimap(){
  const c=document.getElementById('minimap-canvas'), ctx=c.getContext('2d');
  ctx.clearRect(0,0,140,140); ctx.fillStyle='rgba(0,20,0,0.8)'; ctx.beginPath(); ctx.arc(70,70,68,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(70,70,68,0,Math.PI*2); ctx.clip();
  const SCALE = 0.15;
  buildings.forEach(b=>{ ctx.fillStyle='#555'; ctx.fillRect(70+(b.pos.x-playerTank.position.x)*SCALE-2,70+(b.pos.z-playerTank.position.z)*SCALE-2,4,4); });
  for (const z of zones) {
    const zx = 70 + (z.pos.x - playerTank.position.x)*SCALE, zz = 70 + (z.pos.z - playerTank.position.z)*SCALE;
    ctx.fillStyle = z.owner === 'player' ? '#0f0' : z.owner === 'enemy' ? '#f33' : '#aaa';
    ctx.beginPath(); ctx.arc(zx, zz, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
    ctx.fillText(z.name, zx, zz+2.5);
  }
  enemyTanks.forEach(e=>{
    if(e.userData.destroyed) return;
    if(!playerCanSeeEnemy(e)) return;
    ctx.fillStyle='#f44';
    ctx.beginPath(); ctx.arc(70+(e.position.x-playerTank.position.x)*SCALE,70+(e.position.z-playerTank.position.z)*SCALE,3,0,Math.PI*2); ctx.fill();
  });
  destroyedTanks.forEach(t=>{ ctx.fillStyle='#444'; ctx.beginPath(); ctx.arc(70+(t.position.x-playerTank.position.x)*SCALE,70+(t.position.z-playerTank.position.z)*SCALE,3,0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle='#0f0'; ctx.beginPath(); ctx.arc(70,70,4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function pauseGame() {
  if (gameState !== 'playing') return;

    _bypassPauseOnUnlock = true;
    document.exitPointerLock();

  gameState = 'playing';
  pauseMenuEl.style.display = 'none';

}

function returnToMenu() {
  gameState = 'menu';
  stopEngineSound(); stopMenuMusic(); stopBattleMusic();
  if (soundEnabled) startMenuMusic();

  // Если были в мультиплеер-комнате — корректно отключаемся.
  // Иначе сервер продолжает считать нас в комнате, и второй игрок
  // видит наш «мёртвый» танк до таймаута.
  if (mpRoom) {
    try { mpRoom.leave(); } catch(e) {}
    mpRoom = null;
  }
  mpClient = null;
  // Чистим меши и подписи чужих игроков
  for (const sid in mpOtherPlayers) {
    const op = mpOtherPlayers[sid];
    if (op.label) op.label.remove();
    if (op.mesh) scene.remove(op.mesh);
    delete mpOtherPlayers[sid];
  }
  if (document.pointerLockElement === renderer.domElement) {
    _bypassPauseOnUnlock = true;
    document.exitPointerLock();
  }
  setUIVisibility(false);
  for (const e of enemyTanks) if (e.userData.devLabel) e.userData.devLabel.style.display = 'none';
  document.getElementById('main-menu').style.display = 'flex';
  enemySpawnCountdown = 0;
  document.getElementById('spawn-timer').style.display = 'none';
  for (let i = projectiles.length - 1; i >= 0; i--) removeProjectile(i);
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; scene.remove(p); p.geometry.dispose(); p.material.dispose(); }
  particles.length = 0;
  repairStartTimer = 0; repairActiveTimer = 0; repairQueue = []; repairStageIndex = 0; repairTotalTime = 0;
  document.getElementById('hint').textContent = 'Выберите технику и нажмите ИГРАТЬ';
  menuCamera.position.set(0, 400, 0); menuCamera.lookAt(0, 0, 0);
}

// ---------- FPS СЧЁТЧИК ----------
const fpsEl = document.getElementById('fps-counter');
let _fpsFrameCount = 0;
let _fpsAccumTime = 0;
let _fpsLastValue = 0;
function _fpsTick(dt) {
  _fpsFrameCount++;
  _fpsAccumTime += dt;
  if (_fpsAccumTime >= 0.3) {
    const fps = Math.round(_fpsFrameCount / _fpsAccumTime);
    _fpsFrameCount = 0;
    _fpsAccumTime = 0;
    if (fps !== _fpsLastValue) {
      _fpsLastValue = fps;
      fpsEl.textContent = 'FPS: ' + fps;
      fpsEl.classList.remove('warn', 'bad');
      if (fps < 20) fpsEl.classList.add('bad');
      else if (fps < 35) fpsEl.classList.add('warn');
    }
  }
}

// ---------- LOOP ----------
let lastTime = performance.now();
function animate(time){
  requestAnimationFrame(animate);
  let dt = (time-lastTime)/1000;
  lastTime = time;
  if(dt>0.2) dt=0.2;

  // Счётчик считаем в любом состоянии — и в меню, и в игре, и на паузе
  _fpsTick(dt);

  if (gameState === 'menu') {
    menuAngle += dt * 0.15;
    menuCamera.position.x = Math.sin(menuAngle) * 400;
    menuCamera.position.z = Math.cos(menuAngle) * 400;
    menuCamera.position.y = 350;
    menuCamera.lookAt(0, 0, 0);
    renderer.render(scene, menuCamera);
    return;
  }
  if(!playerTank || !playerState) return;

  if (gameState === 'paused') {
    // На паузе логика заморожена, но сцену рендерим
    renderer.render(scene, camera);
    return;
  }

  updatePlayerControls(dt);
  mpSendState(dt);
  updatePlayerModuleBoxes(dt);
  updateAI(dt);
  scene.updateMatrixWorld(true);
  updateProjectiles(dt);
  updateParticles(dt);
  updateRepair(dt);
  updateSmoke(dt);
  updateCamera(dt);
  updateDevLabels();
  updatePlayerNickLabels();
  updateDevMarkers();
  update3DAimMarker();
  updateCrosshair();
  updateDamageIndicators();
  updateMinimap();
  updateZones(dt);
  updateRefill(dt);
  updateReinforcements(dt);
  if (playerState.health > 0) updateEngineSound(playerState.speed);
  if(enemySpawnCountdown > 0){
    enemySpawnCountdown -= dt;
    const timerEl = document.getElementById('spawn-timer');
    if(enemySpawnCountdown <= 0){ enemySpawnCountdown = 0; timerEl.style.display = 'none'; spawnEnemy(); }
    else { timerEl.style.display = 'block'; timerEl.textContent = 'ПРОТИВНИК ЧЕРЕЗ ' + Math.ceil(enemySpawnCountdown) + 'с'; }
  }
  if(playerState.health<=0 && !playerTank.userData.destroyed){
    destroyTank(playerTank); stopEngineSound();
    document.getElementById('hint').textContent='ТЕХНИКА УНИЧТОЖЕНА | Пробел для выхода в меню';
  }
  for(let i = debris.length-1; i >= 0; i--) {
    const d = debris[i];
    if (!d.userData.life) d.userData.life = 5.0;
    d.userData.life -= dt;
    if(d.userData.life <= 0) { scene.remove(d); debris.splice(i,1); continue; }
    if(d.userData.velocity){
      d.userData.velocity.y -= 9.8 * dt;
      d.userData.velocity.multiplyScalar(0.99);
      d.position.x += d.userData.velocity.x * dt;
      d.position.y += d.userData.velocity.y * dt;
      d.position.z += d.userData.velocity.z * dt;
    }
    if(d.userData.angularVelocity){
      d.rotation.x += d.userData.angularVelocity.x * dt;
      d.rotation.y += d.userData.angularVelocity.y * dt;
      d.rotation.z += d.userData.angularVelocity.z * dt;
    }
  }
  sun.position.copy(playerTank.position).add(new THREE.Vector3(50,60,30));
  sun.target.position.copy(playerTank.position);
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
console.log('MODULE END');
</script>
