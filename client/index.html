<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Танковый симулятор — ПТУР, танки и БМП</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; cursor: none; }
    canvas { display: block; }
    #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; height: 500px; opacity: 0.9; pointer-events: none; }
    #crosshair svg { width: 100%; height: 100%; }
    #scope { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; height: 500px; opacity: 0.95; pointer-events: none; }
    #scope svg { width: 100%; height: 100%; }
    #hud-bottom { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; align-items: flex-end; pointer-events: auto; }
    .hud-panel { background: rgba(0,0,0,0.7); border: 1px solid #3a5a3a; border-radius: 6px; padding: 12px 18px; color: #c0d0c0; font-size: 13px; letter-spacing: 1px; backdrop-filter: blur(4px); }
    .hud-label { font-size: 10px; color: #7a9a7a; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
    .hud-value { font-size: 22px; font-weight: bold; color: #e0ffe0; text-shadow: 0 0 10px #00ff0044; }
    #health-bar-outer { width: 200px; height: 8px; background: #1a1a1a; border: 1px solid #3a3a3a; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    #health-bar-inner { height: 100%; background: linear-gradient(90deg, #ff3300, #ff8800, #ffcc00); transition: width 0.3s; border-radius: 3px; }
    .repair-info { font-size: 10px; color: #ffaa00; margin-top: 4px; text-align: center; min-height: 15px; }
    #hit-log { position: absolute; top: 80px; right: 30px; width: 260px; max-height: 200px; background: rgba(0,0,0,0.7); border: 1px solid #3a5a3a; border-radius: 6px; padding: 10px; color: #ddd; font-size: 11px; line-height: 1.5; overflow-y: auto; pointer-events: auto; backdrop-filter: blur(4px); }
    .hit-entry { margin-bottom: 4px; }
    .hit-entry .time { color: #888; margin-right: 6px; }
    .damage-arrow { position: absolute; width: 0; height: 0; border-style: solid; opacity: 0; transition: opacity 0.2s; }
    .damage-arrow.show { opacity: 1; animation: arrowFade 0.8s ease-out forwards; }
    @keyframes arrowFade { 0% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: scale(1); } }
    #damage-panel { position: absolute; left: 30px; bottom: 200px; width: 220px; height: 360px; background: rgba(0,0,0,0.75); border: 1px solid #3a5a3a; border-radius: 10px; backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    #damage-canvas { width: 200px; height: 320px; }
    #minimap { position: absolute; bottom: 30px; right: 30px; width: 140px; height: 140px; border-radius: 50%; border: 2px solid #3a5a3a; background: rgba(0,20,0,0.75); overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
    #minimap canvas { width: 100%; height: 100%; border-radius: 50%; }
    #hint { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #8a8; font-size: 12px; letter-spacing: 2px; opacity: 0.7; text-align: center; }
    #chill-indicator { position: absolute; top: 80px; right: 30px; width: 260px; height: 24px; background: rgba(0,0,0,0.7); border: 1px solid #3a5a3a; border-radius: 6px; color: #0f0; font-size: 13px; font-weight: bold; text-align: center; line-height: 24px; pointer-events: auto; backdrop-filter: blur(4px); display: none; }
    #zone-indicator { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px; letter-spacing: 2px; padding: 6px 14px; background: rgba(0,0,0,0.6); border: 1px solid #3a5a3a; border-radius: 6px; display: none; }
    #dev-indicator { position: absolute; top: 50px; right: 30px; width: 260px; height: 24px; background: rgba(0,0,0,0.7); border: 1px solid #3a5a3a; border-radius: 6px; color: #00ff44; font-size: 13px; font-weight: bold; text-align: center; line-height: 24px; pointer-events: auto; backdrop-filter: blur(4px); display: none; }
    #dev-labels { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .dev-label { position: absolute; transform: translate(-50%, -50%); text-align: center; font-family: 'Courier New', monospace; font-weight: bold; pointer-events: none; white-space: nowrap; text-shadow: 0 0 6px currentColor, 0 0 12px currentColor, 1px 1px 2px #000; }
    .dev-label-top { color: #ff2277; font-size: 14px; letter-spacing: 1px; }
    .dev-label-bottom { color: #22ff88; font-size: 12px; letter-spacing: 1px; }
    #player-labels { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .player-nick-label { position: absolute; transform: translate(-50%, -50%); text-align: center; font-family: 'Courier New', monospace; font-weight: bold; font-size: 14px; letter-spacing: 1px; pointer-events: none; white-space: nowrap; color: #ffe066; text-shadow: 0 0 6px #ffe066, 0 0 12px #ff9900, 1px 1px 2px #000; display: none; }
    #main-menu, #main-menu * { cursor: auto; }
    #main-menu button, #main-menu input[type="checkbox"], #main-menu input[type="range"], #main-menu select, #main-menu label { cursor: pointer; }
    #main-menu button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #222; }
    #main-menu label { cursor: pointer; user-select: none; }
    #main-menu input[type="checkbox"] { width: 20px; height: 20px; vertical-align: middle; margin-right: 10px; }
    .vehicle-select { display: flex; gap: 20px; margin-bottom: 30px; }
    .vehicle-btn { padding: 12px 24px; font-family: 'Courier New', monospace; font-size: 18px; background: #333; color: #fff; border: 3px solid #666; cursor: pointer; transition: 0.2s; }
    .vehicle-btn.selected { background: #0a0; border-color: #0f0; box-shadow: 0 0 15px #0f0; }
    #pause-menu { pointer-events: auto; position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 21; background: rgba(0,0,0,0.55); }
    #pause-menu, #pause-menu * { cursor: auto; }
    .menu-btn { width: 260px; padding: 15px 30px; font-family: 'Courier New', monospace; font-size: 20px; color: #fff; background: #555; border: 4px solid #888; box-shadow: 4px 4px 0 #222; cursor: pointer; margin-bottom: 20px; }
    .menu-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #222; }
    #fps-counter { position: fixed; bottom: 8px; left: 10px; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 1px; color: #6a7a6a; text-shadow: 1px 1px 2px #000; pointer-events: none; z-index: 9999; }
    #fps-counter.warn { color: #c8a040; }
    #fps-counter.bad  { color: #d04040; }
  </style>
</head>
<body>
<div id="ui-layer">
  <div id="spawn-timer" style="position: absolute; top: 55px; left: 50%; transform: translateX(-50%); color: #ffaa00; font-size: 20px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px #000, 0 0 6px #ff6600; pointer-events: none; display: none;">30</div>
  <div id="zone-indicator"></div>
  <div id="main-menu" style="pointer-events: auto; position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; background: rgba(0,0,0,0.3);">
    <div style="font-family: 'Courier New', monospace; font-size: 48px; color: #ffdd00; text-shadow: 4px 4px 0 #000, -2px -2px 0 #ff6600; letter-spacing: 4px; margin-bottom: 20px;">ТАНКИ 3D!</div>
    <div class="vehicle-select">
      <button id="btn-tank" class="vehicle-btn selected">ТАНК</button>

        <button id="btn-multiplayer" style="pointer-events: auto; width: 260px; padding: 15px 30px; font-family: 'Courier New', monospace; font-size: 20px; color: #fff; background: #555; border: 4px solid #888; box-shadow: 4px 4px 0 #222; cursor: pointer; margin-bottom: 20px;">МУЛЬТИПЛЕЕР</button>

      <div style="font-size:20px; margin-bottom:15px; text-align:center; color:#ffdd00;">ПОДКЛЮЧЕНИЕ</div>

        Ваш ник:<br>

        Комната:<br>
        <input type="text" id="mp-room" maxlength="20" value="Бой 1" style="width:100%; margin-top:4px; padding:6px; font-family:'Courier New', monospace; background:#222; color:#fff; border:1px solid #666;">
      </label>
      <label style="display:block; margin-bottom:10px;">
        Пароль (необязательно):<br>
        <input type="text" id="mp-pass" maxlength="20" style="width:100%; margin-top:4px; padding:6px; font-family:'Courier New', monospace; background:#222; color:#fff; border:1px solid #666;">
      </label>
      <div id="mp-status" style="font-size:11px; min-height:16px; color:#8a8; margin-bottom:10px; text-align:center;"></div>
      <button id="mp-connect" style="width:100%; padding:10px; background:#0a0; color:#fff; border:2px solid #0f0; font-family:'Courier New', monospace; font-size:16px; cursor:pointer; margin-bottom:6px;">ПОДКЛЮЧИТЬСЯ</button>
      <button id="mp-cancel" style="width:100%; padding:8px; background:#333; color:#fff; border:2px solid #666; font-family:'Courier New', monospace; font-size:13px; cursor:pointer;">ОТМЕНА</button>
    </div>
    <button id="btn-settings" style="pointer-events: auto; width: 260px; padding: 15px 30px; font-family: 'Courier New', monospace; font-size: 20px; color: #fff; background: #555; border: 4px solid #888; box-shadow: 4px 4px 0 #222; cursor: pointer;">НАСТРОЙКИ</button>
  </div>

  <div id="pause-menu">
    <div style="font-family: 'Courier New', monospace; font-size: 42px; color: #ffdd00; text-shadow: 4px 4px 0 #000, -2px -2px 0 #ff6600; letter-spacing: 4px; margin-bottom: 30px;">ПАУЗА</div>
    <button id="btn-resume" class="menu-btn">ПРОДОЛЖИТЬ</button>
    <button id="btn-pause-settings" class="menu-btn">НАСТРОЙКИ</button>
    <button id="btn-pause-menu" class="menu-btn">В ГЛАВНОЕ МЕНЮ</button>
  </div>

  <div id="settings-panel" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 25; font-family: 'Courier New', monospace; font-size: 16px; color: #fff; background: rgba(0,0,0,0.95); padding: 15px; border: 2px solid #888; width: 320px; max-height: 55vh; overflow-y: auto; pointer-events: auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #444; position:sticky; top:-15px; background:rgba(0,0,0,0.95); z-index:2; margin-top:-15px; padding-top:15px;">
      <span style="font-size:16px; color:#ffdd00; letter-spacing:2px;">НАСТРОЙКИ</span>
      <button id="btn-settings-close" style="padding:6px 14px; background:#a00; color:#fff; border:2px solid #f00; font-family:'Courier New',monospace; font-size:13px; cursor:pointer; letter-spacing:1px;">ЗАКРЫТЬ ✕</button>
    </div>
    <label style="display:block; margin-top:15px;">
      Преимущественный ремонт:<br>
      <label style="display:inline-block; margin-right:15px;"><input type="radio" name="repair-priority" value="combat" checked> Боевые</label>
      <label style="display:inline-block;"><input type="radio" name="repair-priority" value="mobility"> Ходовые</label>
    </label>
    <label style="display:block; margin-bottom:10px;"><input type="checkbox" id="sound-checkbox" checked> ЗВУК: ВКЛ</label>
    <label style="display:block; margin-top:10px;">
      Чувствительность камеры (3-е лицо): <span id="sens-3rd-val" style="color:#ffdd00;">100</span>
      <input type="range" id="sens-3rd" min="5" max="200" step="5" value="100" style="width:100%; margin-top:4px;">
    </label>
    <label style="display:block; margin-top:10px;">
      Чувствительность камеры (прицел): <span id="sens-zoom-val" style="color:#ffdd00;">100</span>
      <input type="range" id="sens-zoom" min="5" max="200" step="5" value="100" style="width:100%; margin-top:4px;">

    <label style="display:block; margin-top:10px;">
      Отдаление камеры: <span id="cam-dist-val" style="color:#ffdd00;">100</span>
      <input type="range" id="cam-dist" min="0" max="100" step="25" value="100" style="width:100%; margin-top:4px;">
    </label>
    <label style="display:block; margin-top:15px;">

      <select id="music-select" style="width:100%; margin-top:4px; background:#222; color:#fff; border:1px solid #666; padding:6px; font-family:'Courier New', monospace; font-size:14px;">
        <option value="calm" selected>Душевно-спокойная</option>
        <option value="military">Армейско-напряжённая</option>
        <option value="fun">Прикольно-веселящая</option>
        <option value="custom">Своя музыка...</option>
      </select>

    <div id="custom-music-row" style="display:none; margin-top:8px;">
      <input type="file" id="music-file-input" accept="audio/*" style="display:none;">
      <button id="music-file-btn" style="width:100%; padding:8px; background:#333; color:#fff; border:2px solid #666; font-family:'Courier New', monospace; font-size:13px; cursor:pointer;">Выбрать файл...</button>
      <div id="music-file-name" style="font-size:11px; color:#8a8; margin-top:4px; text-align:center;">файл не выбран</div>
    </div>
    <label style="display:block; margin-top:15px;">Боевая музыка:</label>
    <div style="margin-top:6px;">
      <input type="file" id="battle-music-file-input" accept="audio/*" style="display:none;">
      <button id="battle-music-file-btn" style="width:100%; padding:8px; background:#333; color:#fff; border:2px solid #666; font-family:'Courier New', monospace; font-size:13px; cursor:pointer;">Выбрать файл...</button>
      <div id="battle-music-file-name" style="font-size:11px; color:#8a8; margin-top:4px; text-align:center;">файл не выбран</div>
    </div>
    <label style="display:block; margin-top:10px;">
      Громкость боевой музыки: <span id="battle-music-vol-val" style="color:#ffdd00;">50</span>
      <input type="range" id="battle-music-vol" min="0" max="100" step="5" value="50" style="width:100%; margin-top:4px;">

  </div>

  <div id="crosshair" style="display:none">
    <svg viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet">
      <circle id="cam-ring" cx="250" cy="250" r="50" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/>
      <circle id="gun-ring" cx="250" cy="250" r="22" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2.5"/>
      <circle id="mg-ring"  cx="250" cy="250" r="7"  fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="2"/>
    </svg>
  </div>
  <div id="scope" style="display:none">
    <svg viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet">
      <!-- Прицел для танка и БМП (упреждение ≈1.91° / шаг метки 40 px) -->

        <line x1="20" y1="250" x2="480" y2="250" stroke="#fff" stroke-width="1.5" opacity="0.85"/>
        <line x1="210" y1="240" x2="210" y2="260" stroke="#fff" stroke-width="1.5"/>
        <line x1="175" y1="236" x2="175" y2="264" stroke="#fff" stroke-width="1.5"/>
        <line x1="140" y1="232" x2="140" y2="268" stroke="#fff" stroke-width="1.5"/>
        <line x1="105" y1="228" x2="105" y2="272" stroke="#fff" stroke-width="1.5"/>
        <line x1="70"  y1="224" x2="70"  y2="276" stroke="#fff" stroke-width="1.5"/>
        <line x1="290" y1="240" x2="290" y2="260" stroke="#fff" stroke-width="1.5"/>
        <line x1="325" y1="236" x2="325" y2="264" stroke="#fff" stroke-width="1.5"/>
        <line x1="360" y1="232" x2="360" y2="268" stroke="#fff" stroke-width="1.5"/>
        <line x1="395" y1="228" x2="395" y2="272" stroke="#fff" stroke-width="1.5"/>
        <line x1="430" y1="224" x2="430" y2="276" stroke="#fff" stroke-width="1.5"/>
        <circle cx="250" cy="250" r="11" fill="none" stroke="#fff" stroke-width="2"/>

        <line x1="210" y1="240" x2="210" y2="260" stroke="#fff" stroke-width="1.5"/>
        <line x1="175" y1="236" x2="175" y2="264" stroke="#fff" stroke-width="1.5"/>
        <line x1="140" y1="232" x2="140" y2="268" stroke="#fff" stroke-width="1.5"/>
        <line x1="105" y1="228" x2="105" y2="272" stroke="#fff" stroke-width="1.5"/>
        <line x1="70"  y1="224" x2="70"  y2="276" stroke="#fff" stroke-width="1.5"/>
        <line x1="290" y1="240" x2="290" y2="260" stroke="#fff" stroke-width="1.5"/>
        <line x1="325" y1="236" x2="325" y2="264" stroke="#fff" stroke-width="1.5"/>
        <line x1="360" y1="232" x2="360" y2="268" stroke="#fff" stroke-width="1.5"/>
        <line x1="395" y1="228" x2="395" y2="272" stroke="#fff" stroke-width="1.5"/>
        <line x1="430" y1="224" x2="430" y2="276" stroke="#fff" stroke-width="1.5"/>
        <circle cx="250" cy="250" r="11" fill="none" stroke="#fff" stroke-width="2"/>
      </g>
    </svg>
  </div>
  <div id="hit-log" style="display:none"></div>
  <div id="chill-indicator">CHILL MODE: OFF</div>
  <div id="dev-indicator">DEV MODE: OFF</div>
  <div id="dev-labels"></div>
  <div id="player-labels"></div>
  <div id="arrow-top" class="damage-arrow" style="top:10px; left:50%; transform:translateX(-50%); border-width: 0 10px 14px 10px; border-color: transparent transparent red transparent; display:none"></div>
  <div id="arrow-bottom" class="damage-arrow" style="bottom:10px; left:50%; transform:translateX(-50%); border-width: 14px 10px 0 10px; border-color: red transparent transparent transparent; display:none"></div>
  <div id="arrow-left" class="damage-arrow" style="left:10px; top:50%; transform:translateY(-50%); border-width: 10px 14px 10px 0; border-color: transparent red transparent transparent; display:none"></div>
  <div id="arrow-right" class="damage-arrow" style="right:10px; top:50%; transform:translateY(-50%); border-width: 10px 0 10px 14px; border-color: transparent transparent transparent red; display:none"></div>
  <div id="hud-bottom" style="display:none">
    <div class="hud-panel"><div class="hud-label">Скорость</div><div class="hud-value" id="speed-val">0</div><div style="font-size:10px;color:#7a9a7a;">км/ч</div></div>
    <div class="hud-panel"><div class="hud-label">Броня</div><div id="health-bar-outer"><div id="health-bar-inner" style="width:100%"></div></div><div class="repair-info" id="repair-hint"></div><div style="font-size:10px;color:#7a9a7a;margin-top:3px;" id="health-text">100%</div></div>

  <div id="damage-panel" style="display:none"><canvas id="damage-canvas" width="200" height="320"></canvas></div>

  <div id="fps-counter">FPS: --</div>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "colyseus.js": "https://esm.sh/colyseus.js@0.15.17"
    }
  }
</script>

<script type="module">
import * as THREE from 'three';

// Colyseus не импортируем статически — он грузится лениво при входе
// в мультиплеер. Иначе, если CDN упадёт, вся игра (включая одиночный режим)
// перестанет работать.
let ColyseusLib = null;
let ColyseusLoadFailed = false;

async function loadColyseusLib() {
  if (ColyseusLib) return ColyseusLib;
  if (ColyseusLoadFailed) return null;
  try {
    ColyseusLib = await import('colyseus.js');
    console.log('Colyseus загружен');
    return ColyseusLib;
  } catch (e) {

function playKick(vol=0.08) {
  if (!soundEnabled) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.setValueAtTime(140, audioCtx.currentTime);

function playTone(freq, dur, type='square', vol=0.04) {
  if (!soundEnabled) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
}
function menuMusicTick() {
  if (!menuMusicPlaying || !soundEnabled) return;
  const track = MUSIC_TRACKS[currentMusicTrack];
  if (!track) return;
  const beatDur = 60 / track.bpm;
  const bar = Math.floor(menuMusicStep / 4) % track.bass.length;
  const beat = menuMusicStep % 4;
  const step16 = menuMusicStep % track.mel.length;
  if (beat === 0) playTone(track.bass[bar], beatDur * 1.6, track.bassType, track.bassVol);
  if (beat % track.kickEvery === 0) playKick(track.kickVol);
  playTone(track.mel[step16], beatDur * 0.8, track.melType, track.melVol);
  menuMusicStep++;
  menuMusicTimer = setTimeout(menuMusicTick, beatDur * 1000);

function getHeight(x, z) {
  const f1 = 0.012, f2 = 0.025, f3 = 0.06;
  return 3.2 * Math.sin(x * f1) * Math.cos(z * f1) +
         2.0 * Math.sin(x * f2 + 1.5) * Math.cos(z * f2 - 0.5) +
         1.2 * Math.sin(x * f3) * Math.cos(z * f3 + 2.0);
}
function getNormal(x, z, delta = 0.5) {
  const h0 = getHeight(x, z);
  const hx = getHeight(x + delta, z);
  const hz = getHeight(x, z + delta);
  const vx = new THREE.Vector3(delta, hx - h0, 0);
  const vz = new THREE.Vector3(0, hz - h0, delta);
  return new THREE.Vector3().crossVectors(vz, vx).normalize();
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.userData.life-=dt;
    if(p.userData.life<=0){ scene.remove(p); p.geometry.dispose(); p.material.dispose(); particles.splice(i,1); }
    else { const r=p.userData.life/p.userData.maxLife; p.material.opacity=r; p.position.x+=p.userData.vel.x*dt; p.position.y+=p.userData.vel.y*dt; p.position.z+=p.userData.vel.z*dt; p.userData.vel.y-=9.8*dt; p.scale.setScalar(r); }
  }
}

const tankModules = ['engine','transmission','leftTrack','rightTrack','gun','breech','turretTraverse','gunElevation','ammoRack'];
const pturModules = ['engine','radiator','wheelFL','wheelFR','wheelML','wheelMR','wheelRL','wheelRR','launcher','ammoRack'];

  ammoRack:'Боекомплект', radiator:'Радиатор', wheelFL:'Лев.пер.колесо', wheelFR:'Прав.пер.колесо',
  wheelML:'Лев.ср.колесо', wheelMR:'Прав.ср.колесо', wheelRL:'Лев.зад.колесо', wheelRR:'Прав.зад.колесо',
  elevation:'Верт.наведение', traverse:'Гориз.наведение', launcher:'Пусковая', sight:'Прицел', hull:'Корпус'
};
function getModulesForType(type){
  if(type==='tank') return tankModules;
  if(type==='ptur') return pturModules;
  if(type==='bmp')  return bmpModules;
  return tankModules;
}
function createModules(type='tank'){
  const mods = {};
  getModulesForType(type).forEach(n => mods[n] = {hp:100, maxHp:100, damaged:false, destroyed:false});
  return mods;
}
function applyModuleDamage(modules, name, damage){
  if(!modules[name] || modules[name].destroyed) return;
  modules[name].hp -= damage;
  if(modules[name].hp <= 0) modules[name].damaged = true;
}
function getModuleMultipliers(modules, type='tank'){
  let s=1, t=1, tr=1, r=1, g=1, ps=1;
  if(type==='tank'){
    if(modules.engine?.damaged) s=0;
    if(modules.transmission?.damaged){ s=0; t=0; }
    if(modules.leftTrack?.damaged || modules.rightTrack?.damaged){ s*=0.3; t*=0.3; }
    if(modules.gun?.damaged){ r*=2.5; g=2.5; }
    if(modules.breech?.destroyed){ r=0; g=0; } else if(modules.breech?.damaged){ r*=1.5; g*=1.5; }
    if(modules.turretTraverse?.destroyed) tr=0; else if(modules.turretTraverse?.damaged) tr=0.05;
    if(modules.gunElevation?.destroyed) ps=0; else if(modules.gunElevation?.damaged) ps=0.1;
  } else if(type==='bmp'){
    if(modules.engine?.damaged) s=0;
    if(modules.transmission?.damaged){ s=0; t=0; }
    if(modules.leftTrack?.damaged || modules.rightTrack?.damaged){ s*=0.3; t*=0.3; }
    if(modules.gun?.damaged){ r*=2.0; g=2.0; }
    if(modules.breech?.destroyed){ r=0; g=0; } else if(modules.breech?.damaged){ r*=1.4; g*=1.4; }
    if(modules.turretTraverse?.destroyed) tr=0; else if(modules.turretTraverse?.damaged) tr=0.05;
    if(modules.gunElevation?.destroyed) ps=0; else if(modules.gunElevation?.damaged) ps=0.1;
  } else {
    // PTUR — колёса. Каждое сломанное колесо = −2 u/s (=-10 км/ч отображаемых).
    // Дуга включается только когда ВСЯ сторона сломана — это проверяется отдельно
    // в одноместной логике (pturArcSide), здесь только скорость.
    if(modules.engine?.damaged) s=0;
    let broken = 0;
    ['wheelFL','wheelFR','wheelML','wheelMR','wheelRL','wheelRR'].forEach(w=>{ if(modules[w]?.damaged) broken++; });
    // base speed 24 u/s = 120 км/ч. Каждое колесо −2 u/s.
    const baseSpeedUnits = 24;
    const reduced = Math.max(0, baseSpeedUnits - broken*2);
    s = reduced / baseSpeedUnits;
    if(modules.radiator?.damaged) s=0;
    if(modules.launcher?.damaged){ r=0; g=0; }
    if(modules.launcher?.destroyed || modules.launcher?.damaged) { ps=0; tr=0; }
  }
  return {speedMul:s, turnMul:t, turretRotMul:tr, reloadMul:r, gunSpread:g, pitchSpeedMul:ps};
}
// Возвращает 'left'/'right'/null — сломана ли ВСЯ сторона колёс у ПТУР (для дуги).
function pturBrokenSide(modules){
  const left  = ['wheelFL','wheelML','wheelRL'];
  const right = ['wheelFR','wheelMR','wheelRR'];
  if(left.every(w=>modules[w]?.damaged))  return 'left';

}

// ---------- ОБЩИЕ ФУНКЦИИ ПОВРЕЖДЕНИЙ ----------
function addBulletHole(tank, point, normal, parentMesh){
  if(tank.userData.destroyed) return;
  if(tank.userData.bulletHoles.length>25){ const old=tank.userData.bulletHoles.shift(); if(old?.parent) old.parent.remove(old); }
  const hole = new THREE.Mesh(new THREE.CircleGeometry(0.07,10), new THREE.MeshBasicMaterial({color:0x0a0a0a, side:THREE.DoubleSide, depthTest:true, depthWrite:true, transparent:true, opacity:0.95}));
  let attach = parentMesh;
  while(attach){ if(attach.name==='hull'||attach.name==='turret'||attach.name==='elevation'||attach.name==='traverse'||attach.name==='launcher') break; attach=attach.parent; }
  if(!attach) return;
  attach.updateWorldMatrix(true, false);
  const localPoint = attach.worldToLocal(point.clone());
  const localNormal = normal.clone().applyQuaternion(attach.getWorldQuaternion(new THREE.Quaternion()).invert()).normalize();
  hole.position.copy(localPoint);
  hole.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), localNormal);
  hole.position.addScaledVector(localNormal, 0.015);
  attach.add(hole);
  tank.userData.bulletHoles.push(hole);
  spawnParticles(point.clone(),5,0xff6600,0.3,0.4,0.04);
}
function applyVisualDamage(tank, moduleName){
  const ud = tank.userData;
  if(ud.type==='tank' || ud.type==='bmp'){
    if(moduleName==='leftTrack' && ud.leftTrackMesh) ud.leftTrackMesh.visible=false;
    if(moduleName==='rightTrack' && ud.rightTrackMesh) ud.rightTrackMesh.visible=false;
    if(moduleName==='gun' && ud.barrelMesh){ ud.barrelMesh.scale.z=0.5; ud.barrelMesh.position.z = ud.type==='bmp'?0.7:1.2; if(ud.muzzleMesh) ud.muzzleMesh.visible=false; }
    if(moduleName==='transmission' && ud.transMesh) { ud.transMesh.material = ud.transMesh.material.clone(); ud.transMesh.material.color.set(0x1a1a1a); }
    if(moduleName==='engine' && ud.engineMesh) { ud.engineMesh.material = ud.engineMesh.material.clone(); ud.engineMesh.material.color.set(0x1a1a1a); }
  } else {
    if(moduleName.startsWith('wheel') && ud.wheels[moduleName]) ud.wheels[moduleName].visible = false;
    if(moduleName==='launcher'){
      if(ud.launcherGroup) ud.launcherGroup.children.forEach(c=>c.visible=false);
      if(ud.elevGroup) ud.elevGroup.children.forEach(c=>c.visible=false);
      if(ud.traverseGroup) ud.traverseGroup.children.forEach(c=>c.visible=false);
    }
  }
}
function destroyTank(tank, isAmmoRack=false){
  if(tank.userData.destroyed) return;
  tank.userData.destroyed = true;
  if (tank.userData.devLabel) {
    tank.userData.devLabel.remove();
    tank.userData.devLabel = null; tank.userData.devLabelTop = null; tank.userData.devLabelBottom = null;
  }
  if (tank.userData.devGoalMarker) {
    scene.remove(tank.userData.devGoalMarker);
    tank.userData.devGoalMarker.geometry?.dispose();
    tank.userData.devGoalMarker.material?.map?.dispose();
    tank.userData.devGoalMarker.material?.dispose();
    tank.userData.devGoalMarker = null;
  }
  if(isAmmoRack){
    if(tank.userData.type==='tank' || tank.userData.type==='bmp'){
      const turret = tank.userData.turretGroup, gun = tank.userData.gunGroup, hull = tank.userData.hullGroup;
      if(gun && turret){
        turret.updateWorldMatrix(true, true);
        const gunWorldPos = gun.getWorldPosition(new THREE.Vector3());
        const gunWorldQuat = gun.getWorldQuaternion(new THREE.Quaternion());
        turret.remove(gun); scene.add(gun);
        gun.position.copy(gunWorldPos); gun.quaternion.copy(gunWorldQuat);
        const forward = new THREE.Vector3(0,0,1).applyQuaternion(gunWorldQuat);
        gun.userData.velocity = forward.multiplyScalar(4); gun.userData.velocity.y += 2;
        gun.userData.angularVelocity = new THREE.Vector3(0.8,0.6,0.4); gun.userData.life = 10;
        debris.push(gun);
      }
      if(turret){
        turret.updateWorldMatrix(true, true);
        const turretWorldPos = turret.getWorldPosition(new THREE.Vector3());
        const turretWorldQuat = turret.getWorldQuaternion(new THREE.Quaternion());
        turret.removeFromParent(); scene.add(turret);
        turret.position.copy(turretWorldPos); turret.quaternion.copy(turretWorldQuat);
        turret.userData.velocity = new THREE.Vector3((Math.random()-0.5)*2, 8+Math.random()*2, (Math.random()-0.5)*2);
        turret.userData.angularVelocity = new THREE.Vector3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1);
        turret.userData.life = 10;
        debris.push(turret);
      }
      if(hull){ hull.updateWorldMatrix(true, true); hull.traverse(c=>{ if(c.isMesh && c.material.color) c.material.color.set(0x1a1a1a); }); }
      spawnParticles(tank.position.clone().add(new THREE.Vector3(0,1.5,0)), 60, 0xffaa00, 3, 1.5, 0.12);
      sfx.ammoExplosion();
    } else {
      const hull = tank.userData.hullGroup, elev = tank.userData.elevGroup, trav = tank.userData.traverseGroup, launch = tank.userData.launcherGroup;
      const hullQuat = hull.quaternion.clone();
      if(hull) hull.traverse(c=>{ if(c.isMesh && c.material.color) c.material.color.set(0x1a1a1a); });
      if(elev){ elev.position.copy(tank.position.clone().add(new THREE.Vector3(0,0.9,0).applyQuaternion(hullQuat))); scene.add(elev); elev.userData.velocity=new THREE.Vector3((Math.random()-0.5)*4,Math.random()*3+2,(Math.random()-0.5)*4); elev.userData.angularVelocity=new THREE.Vector3(Math.random()*2,Math.random()*2,Math.random()*2); elev.userData.life = 10; debris.push(elev); }
      if(trav){ trav.position.copy(tank.position.clone().add(new THREE.Vector3(0,0.75,0).applyQuaternion(hullQuat))); scene.add(trav); trav.userData.velocity=new THREE.Vector3((Math.random()-0.5)*3,Math.random()*2+1,(Math.random()-0.5)*3); trav.userData.life = 10; debris.push(trav); }
      if(launch){ launch.position.copy(tank.position.clone().add(new THREE.Vector3(0,1.5,0).applyQuaternion(hullQuat))); scene.add(launch); launch.userData.velocity=new THREE.Vector3((Math.random()-0.5)*5,Math.random()*5+3,(Math.random()-0.5)*5); launch.userData.angularVelocity=new THREE.Vector3(Math.random()*3,Math.random()*3,Math.random()*3); launch.userData.life = 10; debris.push(launch); }
      spawnParticles(tank.position.clone().add(new THREE.Vector3(0,1.5,0)), 60, 0xffaa00, 3, 1.5, 0.12);
      sfx.ammoExplosion();
    }
    tank.userData.smokeParticles.forEach(p => { scene.remove(p); p.geometry?.dispose(); p.material?.dispose(); });
    tank.userData.smokeParticles = [];
    const eIdx = enemyTanks.indexOf(tank);
    if(eIdx >= 0) { enemyTanks.splice(eIdx, 1); destroyedTanks.push(tank); }
  } else {
    tank.traverse(c=>{if(c.isMesh&&c.material.color)c.material.color.set(0x1a1a1a);});
    spawnParticles(tank.position.clone().add(new THREE.Vector3(0,1.5,0)), 40, 0xff4400, 3, 1.5);
    sfx.explosion();
    const eIdx = enemyTanks.indexOf(tank);
    if(eIdx >= 0) { enemyTanks.splice(eIdx, 1); destroyedTanks.push(tank); }
  }
}

function spawnEngineSmoke(tank) {
  if(!tank || tank.userData.destroyed) return;
  const hullGroup = tank.userData.hullGroup;
  const backDir = new THREE.Vector3(0,0,-1).applyQuaternion(hullGroup.quaternion);
  const backPos = tank.position.clone().add(backDir.clone().multiplyScalar(2.2)).add(new THREE.Vector3(0, 1.3, 0));
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.35,6,6), new THREE.MeshBasicMaterial({color:0x111111, transparent:true, opacity:0.8}));
  p.position.copy(backPos).add(new THREE.Vector3((Math.random()-0.5)*0.6, Math.random()*0.4, (Math.random()-0.5)*0.6));
  p.userData = { life: 5.0, vel: new THREE.Vector3(0, 1.0 + Math.random()*0.8, 0), tank: tank };
  scene.add(p); tank.userData.smokeParticles.push(p);
}
function updateSmoke(dt) {
  const tanks = [playerTank, ...enemyTanks, ...destroyedTanks];
  for(const tank of tanks) {
    if(!tank) continue;
    if(tank.userData.modules && tank.userData.modules.engine?.damaged && !tank.userData.destroyed) {
      tank.userData.engineSmokeTimer = (tank.userData.engineSmokeTimer||0) + dt;
      while(tank.userData.engineSmokeTimer >= 0.3) { tank.userData.engineSmokeTimer -= 0.3; spawnEngineSmoke(tank); }
    }
    const smokes = tank.userData.smokeParticles;
    for(let i = smokes.length-1; i >= 0; i--) {
      const s = smokes[i]; s.userData.life -= dt;
      if(s.userData.life <= 0) { scene.remove(s); s.geometry?.dispose(); s.material?.dispose(); smokes.splice(i,1); }
      else {
        s.position.y += s.userData.vel.y * dt;
        if(!tank.userData.destroyed) {
          const hullGroup = tank.userData.hullGroup;
          const backDir = new THREE.Vector3(0,0,-1).applyQuaternion(hullGroup.quaternion);
          const backPos = tank.position.clone().add(backDir.clone().multiplyScalar(2.2)).add(new THREE.Vector3(0,1.3,0));
          s.position.x = backPos.x + (s.position.x - backPos.x)*0.95;
          s.position.z = backPos.z + (s.position.z - backPos.z)*0.95;
        }
        s.material.opacity = Math.max(0, s.userData.life/5.0);
        s.scale.setScalar(1 + (1 - s.userData.life/5.0)*0.5);
      }
    }
  }
}

function playerLookingAt(target, maxDist = 300, maxAngleRad = Math.PI / 3) {
  if (!playerTank || playerState.health <= 0) return false;
  const dx = target.x - playerTank.position.x;
  const dz = target.z - playerTank.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist > maxDist) return false;
  const camX = Math.sin(playerState.cameraYaw), camZ = Math.cos(playerState.cameraYaw);
  const toX = dx / (dist || 1), toZ = dz / (dist || 1);
  const cosA = camX*toX + camZ*toZ;
  return Math.acos(Math.max(-1, Math.min(1, cosA))) < maxAngleRad;
}

// ---------- МУЛЬТИПЛЕЕР ----------
let mpClient = null;
let mpRoom = null;
let mpNickname = "";
const mpOtherPlayers = {};   // sessionId -> { mesh, state }

function connectMultiplayer(nickname, roomName, password, onJoinRoom) {
  mpNickname = nickname;

  (async () => {
    const lib = await loadColyseusLib();
    if (!lib) {
      const st = document.getElementById('mp-status');
      if (st) {
        st.textContent = 'Сервер недоступен. Проверьте интернет или зайдите позже.';
        st.style.color = '#f44';
      }
      return;
    }
    mpClient = new lib.Client(`wss://tanki-97z9.onrender.com`);

    try {
      mpRoom = await mpClient.joinOrCreate("battle", {
        roomKey: roomName,
        password: password || null,
        nickname: nickname,
        vehicleType: selectedVehicle
      });
      console.log("Подключились к комнате:", mpRoom.roomId, "sessionId:", mpRoom.sessionId);

      // --- Спавн чужого танка ---
      const spawnOther = (p) => {
        if (!p || p.sessionId === mpRoom.sessionId) return;
        if (mpOtherPlayers[p.sessionId]) return;

        const vType = p.vehicleType || 'tank';
        let mesh;
        if (vType === 'ptur')      mesh = createPTUR(0x8a3a3a, false);
        else if (vType === 'bmp')  mesh = createBMP(0x8a3a3a, false);
        else                       mesh = createTankBody(0x8a3a3a, false);

        mesh.position.set(p.x, getHeight(p.x, p.z), p.z);
        scene.add(mesh);

        const label = document.createElement('div');
        label.className = 'player-nick-label';
        label.textContent = p.nickname || 'Игрок';
        label.style.display = 'none';
        document.getElementById('player-labels').appendChild(label);

        mpOtherPlayers[p.sessionId] = { mesh, data: p, label, vType };
        console.log("+ игрок:", p.nickname, p.sessionId, vType);
      };

      // --- Обновление чужого танка ---
      const updateOther = (p) => {
        const op = mpOtherPlayers[p.sessionId];
        if (!op || !op.mesh) return;
        op.mesh.position.set(p.x, getHeight(p.x, p.z), p.z);
        op.mesh.userData.hullGroup.rotation.y = p.hullYaw;

        if (op.vType === 'ptur') {
          // ПТУР: вращаем launcherGroup относительно корпуса
          const hullQuat = op.mesh.userData.hullGroup.quaternion;
          const launcherOffset = new THREE.Vector3(0, 1.5, 0).applyQuaternion(hullQuat);
          op.mesh.userData.launcherGroup.position.copy(launcherOffset);
          op.mesh.userData.elevGroup.position.copy(new THREE.Vector3(0,0.9,0).applyQuaternion(hullQuat));
          const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), p.turretYaw);
          const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -p.gunPitch);
          op.mesh.userData.launcherGroup.quaternion.copy(qYaw).multiply(qPitch);
        } else {
          // Танк и БМП: turretGroup + gunGroup
          op.mesh.userData.turretGroup.rotation.y = p.turretYaw - p.hullYaw;
          op.mesh.userData.gunGroup.rotation.x = -p.gunPitch;
        }
        op.data = p;
      };

      // --- Удаление чужого танка ---
      const removeOther = (sessionId) => {
        const op = mpOtherPlayers[sessionId];
        if (op && op.mesh) scene.remove(op.mesh);
        if (op && op.label) op.label.remove();
        delete mpOtherPlayers[sessionId];
        console.log("- игрок:", sessionId);
      };

      // 1) Получили список уже находящихся в комнате
      mpRoom.onMessage("existingPlayers", (playersObj) => {
        console.log("Существующие игроки:", playersObj);
        for (const sid in playersObj) {
          spawnOther(playersObj[sid]);
        }
      });

      // 2) Кто-то зашёл
      mpRoom.onMessage("playerJoined", (p) => {
        spawnOther(p);
        addHitLog(`Игрок ${p.nickname} подключился`);
      });

      // 3) Кто-то вышел
      mpRoom.onMessage("playerLeft", ({ sessionId }) => {
        const op = mpOtherPlayers[sessionId];
        const nick = (op && op.data && op.data.nickname) ? op.data.nickname : sessionId;
        removeOther(sessionId);
        addHitLog(`Игрок ${nick} отключился`);
      });

      // 4) Кто-то прислал обновление позиции
      mpRoom.onMessage("stateSync", (p) => {
        if (!mpOtherPlayers[p.sessionId]) spawnOther(p);
        updateOther(p);
      });

      // 5) Чужой выстрел — создаём снаряд визуально (без локального урона)
      mpRoom.onMessage("shoot", (data) => {
        const origin = new THREE.Vector3(data.origin.x, data.origin.y, data.origin.z);
        const dir = new THREE.Vector3(data.dir.x, data.dir.y, data.dir.z).normalize();
        const speed = data.speed || (data.type === 'ptur' ? 100 : 360);
        const isRocket = data.type === 'ptur';
        const isAutocannon = data.type === 'bmp';
        const proj = createProjectile(origin, dir, speed, false, isRocket, isAutocannon);
        proj.isRemote = true;
        spawnParticles(origin, isAutocannon ? 4 : 8, 0xffaa00, 0.4, 0.25, 0.05);
      });

      // 6) Здоровье изменилось
      mpRoom.onMessage("healthUpdate", ({ sessionId, health }) => {
        // Если это мы — обновляем свой HUD
        if (sessionId === mpRoom.sessionId) {
          if (playerState) {
            const prev = playerState.health;
            playerState.health = health;
            updatePlayerHealthUI();
            if (health < prev) addHitLog(`Нас зацепило: -${prev - health}`);
          }
          return;
        }
        const op = mpOtherPlayers[sessionId];
        if (op) op.data.health = health;
      });

      // 6.5) У кого-то сломался модуль
      mpRoom.onMessage("moduleUpdate", ({ sessionId, module, damaged, destroyed }) => {
        // Если это МЫ — обновляем свои модули, применяем визуал и HUD.
        // Без этой ветки у жертвы не активируется арк-режим и не краснеет панель.
        if (sessionId === mpRoom.sessionId) {
          if (playerState && playerState.modules && playerState.modules[module]) {
            playerState.modules[module].damaged = damaged;
            playerState.modules[module].destroyed = destroyed;
            if (damaged || destroyed) playerState.modules[module].hp = 0;
            if (playerTank) applyVisualDamage(playerTank, module);
            updateDamageUI();
            addHitLog(`Наш модуль сломан: ${moduleLabels[module] || module}`);
          }
          return;
        }
        // Иначе — чужой игрок
        const op = mpOtherPlayers[sessionId];
        if (!op || !op.mesh) return;
        if (op.data && op.data.modules && op.data.modules[module]) {
          op.data.modules[module].damaged = damaged;
          op.data.modules[module].destroyed = destroyed;
        }
        applyVisualDamage(op.mesh, module);
        addHitLog(`Модуль ${op.data?.nickname || 'игрока'} сломан: ${moduleLabels[module] || module}`);
      });

      // 7) Кто-то уничтожен
      mpRoom.onMessage("playerDied", ({ sessionId, killerId }) => {
        const victimOp = mpOtherPlayers[sessionId];
        const victimNick = victimOp ? (victimOp.data.nickname || sessionId) : sessionId;
        let killerNick;
        if (killerId === mpRoom.sessionId) killerNick = mpNickname;
        else {
          const killerOp = mpOtherPlayers[killerId];
          killerNick = killerOp ? (killerOp.data.nickname || killerId) : killerId;
        }
        addHitLog(`Игрок ${killerNick} убил игрока ${victimNick}`);

        if (sessionId !== mpRoom.sessionId) {
          // Убрать чужой танк с карты
          const op = mpOtherPlayers[sessionId];
          if (op && op.mesh) {
            // Небольшой взрыв на месте
            spawnParticles(op.mesh.position.clone().add(new THREE.Vector3(0,1.5,0)), 40, 0xff4400, 3, 1.5);
            sfx.explosion();
          }
          removeOther(sessionId);
        } else {
          // Нас убили — заглушка до меню смерти
          document.getElementById('hint').textContent = `Вас убил игрок ${killerNick}. Esc — пауза, Пробел — меню.`;
        }
      });

      if (onJoinRoom) onJoinRoom(mpRoom);
    } catch (e) {
      console.error("Не удалось подключиться:", e);
      const st = document.getElementById('mp-status');
      if (st) { st.textContent = 'Ошибка: ' + (e.message || e); st.style.color = '#f44'; }
    }
  })();
}

// ---------- PROJECTILES ----------
const projectiles = [];
function createProjectile(origin, dir, speed, isPlayer, isRocket=false, isAutocannon=false){
  const g = new THREE.Group();
  if(isRocket){
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.4,6).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({color:isPlayer?0xffcc00:0xff4400})));
  } else if (isAutocannon) {
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.5,6).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({color:isPlayer?0xffee66:0xff6633})));
  } else {
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6), new THREE.MeshBasicMaterial({color:isPlayer?0xffcc00:0xff4400})));
  }
  const trail = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.08,0.8,6).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({color:isPlayer?0xffaa00:0xff3300, transparent:true, opacity:0.8}));
  trail.position.z=-0.5; g.add(trail);
  g.position.copy(origin); g.lookAt(origin.clone().add(dir));
  const proj = { group:g, direction:dir.clone().normalize(), speed, isPlayer, isRocket, isAutocannon, life:10, prevPos:origin.clone() };
  scene.add(g); projectiles.push(proj);
  return proj;
}
function removeProjectile(i){
  const p=projectiles[i]; scene.remove(p.group);
  p.group.children.forEach(c=>{c.geometry?.dispose(); c.material?.dispose();});
  projectiles.splice(i,1);
}

    turretTraverse:[cx-6,cy+10], gunElevation:[cx+10,cy+18]
  };
  const positionsPTUR = {
    engine:[cx,cy+40], radiator:[cx,cy+52], wheelFL:[cx-42,cy-45], wheelFR:[cx+42,cy-45],
    wheelML:[cx-42,cy], wheelMR:[cx+42,cy], wheelRL:[cx-42,cy+45], wheelRR:[cx+42,cy+45],
    launcher:[cx,cy-20], ammoRack:[cx,cy+10]
  };
  const positions = type==='tank' ? positionsTank : (type==='bmp' ? positionsBMP : positionsPTUR);
  const mods = getModulesForType(type);
  for(let name of mods){
    const mod=modules[name];
    if(!mod) continue;
    const [x,y]=positions[name]||[0,0];
    let color = mod.destroyed?'#111':(mod.damaged?'#a00':(mod.hp<30?'#c00':(mod.hp<70?'#c90':'#0a0')));
    dCtx.fillStyle=color; dCtx.beginPath(); dCtx.arc(x,y,6,0,Math.PI*2); dCtx.fill();
    dCtx.strokeStyle='#fff'; dCtx.lineWidth = 1; dCtx.stroke();
  }
}

// ---------- SHOOTING ----------
function shootTank(tank, isPlayer){
  if(isPlayer && (!playerState.canShoot||playerState.health<=0)) return;
  if(!isPlayer && !tank.userData.ai.canShoot) return;
  if(tank.userData.destroyed) return;
  const type = tank.userData.type;
  if((type==='tank'||type==='bmp') && (tank.userData.modules.gun?.damaged || tank.userData.modules.breech?.destroyed)) return;
  if(type==='ptur' && tank.userData.modules.launcher?.damaged) return;
  if(isPlayer){
    if(type==='tank' && playerState.ammo <= 0) return;
    if(type==='bmp' && playerState.ammo <= 0) return;
    if(type==='ptur' && playerState.magazineCount <= 0) return;
  }

  let muzzle, dir;
  if(type==='tank' || type==='bmp'){
    const gun = tank.userData.gunGroup;
    const muzzleDist = type==='bmp' ? 2.8 : 5.1;
    muzzle = gun.localToWorld(new THREE.Vector3(0,0,muzzleDist));
    dir = gun.localToWorld(new THREE.Vector3(0,0,muzzleDist+1)).sub(gun.getWorldPosition(new THREE.Vector3())).normalize();
  } else {
    const launcher = tank.userData.launcherGroup;
    const barrelIdx = tank.userData.currentBarrel;
    const barrelMesh = launcher.getObjectByName(`launchMesh${barrelIdx}`);
    if(!barrelMesh) return;
    muzzle = barrelMesh.getWorldPosition(new THREE.Vector3());
    const launcherQuat = launcher.getWorldQuaternion(new THREE.Quaternion());
    dir = new THREE.Vector3(0,0,1).applyQuaternion(launcherQuat);
  }

  // Компенсация параллакса камеры в 3-м лице.
  // Камера за танком, ствол впереди — луч из дула должен сойтись
  // с лучом камеры (центром экрана) на разумной дистанции.
  // В прицеле (Q) не нужен — там камера уже почти в стволе.
  if (isPlayer && !playerState.isZoomed && cameraDistCoef > 0.01) {
    const cp = Math.cos(playerState.cameraPitch);
    const cdX = Math.sin(playerState.cameraYaw) * cp;
    const cdY = Math.sin(playerState.cameraPitch);
    const cdZ = Math.cos(playerState.cameraYaw) * cp;
    const camX = playerTank.position.x - Math.sin(playerState.cameraYaw) * 14 * cameraDistCoef;
    const camY = playerTank.position.y + 7 * (0.3 + 0.7 * cameraDistCoef);
    const camZ = playerTank.position.z - Math.cos(playerState.cameraYaw) * 14 * cameraDistCoef;
    // Дистанция прицеливания: у БМП бой ближе, у танка дальше
    const aimDist = (type === 'bmp') ? 180 : 350;
    const aimX = camX + cdX * aimDist;
    const aimY = camY + cdY * aimDist;
    const aimZ = camZ + cdZ * aimDist;
    dir.set(aimX - muzzle.x, aimY - muzzle.y, aimZ - muzzle.z).normalize();
  }

  let spread;
  if (type==='bmp') spread = isPlayer ? 0.005 : 0.03;
  else spread = isPlayer ? ((playerState.modules?getModuleMultipliers(playerState.modules,playerState.vehicleType):{gunSpread:1}).gunSpread * 0.002) : 0.02;
  if(spread > 0) { dir.x+=(Math.random()-0.5)*spread; dir.y+=(Math.random()-0.5)*spread; dir.z+=(Math.random()-0.5)*spread; dir.normalize(); }

  const speed = type==='ptur' ? 100 : 360;
  const isRocket = type==='ptur';
  const isAutocannon = type==='bmp';
  createProjectile(muzzle, dir, speed, isPlayer, isRocket, isAutocannon);
  spawnParticles(muzzle, isAutocannon?4:8, 0xffaa00, 0.4, 0.25, 0.05);
  if(isRocket) sfx.rocket(); else if(isAutocannon) sfx.autocannon(); else sfx.shoot();

  // В мультиплеере рассылаем выстрел остальным — они рисуют снаряд у себя
  if (isPlayer && mpRoom) {
    mpRoom.send("shoot", {
      origin: { x: muzzle.x, y: muzzle.y, z: muzzle.z },
      dir: { x: dir.x, y: dir.y, z: dir.z },
      speed: speed,
      type: type
    });
  }

  if(isPlayer){
    if(type==='ptur'){
      playerState.magazineCount--;
      tank.userData.currentBarrel = (tank.userData.currentBarrel + 1) % 4;
      updateAmmoUI();
      if(playerState.magazineCount <= 0){
        playerState.canShoot = false;
        playerState.magazineReloadTimer = 5.0;
        document.getElementById('reload-indicator').textContent = playerState.reserveAmmo > 0 ? 'ПЕРЕЗАРЯДКА' : 'НЕТ РАКЕТ';
      } else {
        playerState.cooldownTimer = 0.5;
        playerState.canShoot = false;
        document.getElementById('reload-indicator').textContent='ЗАЛП';
      }
    } else if (type==='bmp'){
      playerState.ammo--;
      updateAmmoUI();
      playerState.canShoot = false;
      playerState.reloadTimer = 1/3;
      document.getElementById('reload-indicator').textContent = 'ОЧЕРЕДЬ';
    } else {
      playerState.ammo--;
      updateAmmoUI();
      playerState.canShoot = false;
      const mul = playerState.modules?getModuleMultipliers(playerState.modules,'tank'):{reloadMul:1};
      playerState.reloadTimer = playerState.reloadTime * mul.reloadMul;
      document.getElementById('reload-indicator').textContent='ПЕРЕЗАРЯДКА';
    }
  } else {
    const ai = tank.userData.ai;
    ai.canShoot = false; ai.reloadTimer = ai.reloadTime;
  }
}

function getHitModuleName(hitObject, localPoint, attachName, type){
  const name = hitObject.name;
  if(type==='tank'){
    if(attachName==='hull'){
      if(name==='trackMesh') return localPoint.x<0?'leftTrack':'rightTrack';
      if(name==='hullMesh'){ if(localPoint.z<-0.5) return 'engine'; if(localPoint.z>0.3 && localPoint.y<0.8) return 'transmission'; return 'hull'; }
    } else if(attachName==='turret'){
      if(name==='turretMesh'){
        if(localPoint.z<-0.3) return 'ammoRack';
        const gunPos = new THREE.Vector3(0,0.9,0.2); const distToGun = Math.sqrt((localPoint.x-gunPos.x)**2+(localPoint.z-gunPos.z)**2);
        if(distToGun<0.35) return 'breech'; if(localPoint.z>0.3 && localPoint.x>0.3) return 'gunElevation';
        return 'turretTraverse';
      }
      if(name==='gunMesh') return 'gun';
    }
  } else if(type==='bmp'){
    if(attachName==='hull'){
      if(name==='trackMesh') return localPoint.x<0?'leftTrack':'rightTrack';
      if(name==='transMesh') return 'transmission';
      if(name==='engineMesh') return 'engine';
      if(name==='hullMesh'){ if(localPoint.z<-0.5) return 'engine'; if(localPoint.z>0.5) return 'transmission'; return 'hull'; }
    } else if(attachName==='turret'){
      if(name==='breechMesh') return 'breech';
      if(name==='gunMesh') return 'gun';
      if(name==='turretMesh'){
        // Попадание в верх — различаем traverse/elevation по знаку локального z
        if(localPoint.z>0.15) return 'gunElevation';
        return 'turretTraverse';
      }
    }
  } else {
    if(name==='wheelMesh'){
      const wx = localPoint.x, wz = localPoint.z;
      if(wz>0.5) return wx<0?'wheelFL':'wheelFR';
      if(wz<-0.5) return wx<0?'wheelRL':'wheelRR';
      return wx<0?'wheelML':'wheelMR';
    }
    if(name==='ammoRackMesh') return 'ammoRack';
    if(name.startsWith('launchMesh')) return 'launcher';
    if(name==='elevMesh') return 'launcher';
    if(name==='travMesh') return 'launcher';
    if(name==='sightMesh') return 'launcher';
    if(name==='hullMesh'){
      if(localPoint.z<-1.0) return 'radiator';
      if(localPoint.z<-0.3) return 'engine';
      return 'hull';
    }
  }
  return 'hull';
}

const DEV_MARKER_SIZE = 5;
function makeDevMarkerMesh(size, colorHex, numberText) {
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d');
  const cx = S/2, cy = S/2, r = S * 0.34;
  ctx.strokeStyle = colorHex; ctx.lineWidth = S * 0.06; ctx.shadowColor = colorHex; ctx.shadowBlur = S * 0.14;
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.18, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = colorHex; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  if (numberText !== undefined && numberText !== null) {
    ctx.fillStyle = '#000'; ctx.font = `bold ${S * 0.5}px monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(numberText), cx, cy + S * 0.02);
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.PlaneGeometry(size, size).rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide, opacity: 0.95, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, fog: false });
  const mesh = new THREE.Mesh(geo, mat); mesh.renderOrder = 5;
  return mesh;
}

// ---------- ZONES UPDATE ----------
function updateZones(dt) {
  for (const zone of zones) {
    const dxP = playerTank.position.x - zone.pos.x, dzP = playerTank.position.z - zone.pos.z;
    const playerIn = (Math.hypot(dxP, dzP) < ZONE_RADIUS) && playerState.health > 0;
    let enemyIn = false;
    for (const e of enemyTanks) {
      if (e.userData.destroyed) continue;
      if (Math.hypot(e.position.x - zone.pos.x, e.position.z - zone.pos.z) < ZONE_RADIUS) { enemyIn = true; break; }
    }
    if (playerIn && !enemyIn) {
      const prevOwner = zone.owner;
      zone.capture = Math.min(100, zone.capture + (100/ZONE_CAPTURE_TIME)*dt);
      updateZoneVisual(zone);
      if (zone.capture >= 100 && prevOwner !== 'player') { zone.owner = 'player'; addHitLog(`Зона ${zone.name} захвачена`); shareIntelPlayerPos(zone.pos); }
      else if (prevOwner === 'enemy' && zone.capture >= 0) zone.owner = 'neutral';
    } else if (enemyIn && !playerIn) {
      const prevOwner = zone.owner;
      zone.capture = Math.max(-100, zone.capture - (100/ZONE_CAPTURE_TIME)*dt);
      updateZoneVisual(zone);
      if (zone.capture <= -100 && prevOwner !== 'enemy') { zone.owner = 'enemy'; addHitLog(`Враг захватил зону ${zone.name}`); }
      else if (prevOwner === 'player' && zone.capture <= 0) zone.owner = 'neutral';
    }
  }
  updateZoneIndicator();
}
function updateZoneIndicator() {
  const el = document.getElementById('zone-indicator');
  if (gameState !== 'playing') { el.style.display = 'none'; return; }
  el.style.display = 'block';
  let s = '';
  for (const z of zones) { const color = z.owner === 'player' ? '#0f0' : z.owner === 'enemy' ? '#f33' : '#aaa'; s += `<span style="color:${color}">${z.name}</span> `; }
  el.innerHTML = s;
}

// ---------- REFILL / REINFORCEMENTS ----------
function updateRefill(dt) {
  if (!playerState || playerState.health <= 0) return;
  let onOwnZone = false;
  for (const z of zones) if (z.owner === 'player' && Math.hypot(playerTank.position.x - z.pos.x, playerTank.position.z - z.pos.z) < ZONE_RADIUS) { onOwnZone = true; break; }
  if (!onOwnZone) {
    const reloadEl = document.getElementById('reload-indicator');
    if (playerState.canShoot && reloadEl.textContent === 'ПОПОЛНЕНИЕ...') { reloadEl.textContent = 'ГОТОВ'; reloadEl.style.color = '#ffaa00'; }
    return;
  }
  let refilling = false;
  if (playerState.vehicleType === 'ptur') {
    if (playerState.reserveAmmo < 20) refilling = true;
    playerState.refillAccumulator += dt;
    while (playerState.refillAccumulator >= 5) { playerState.refillAccumulator -= 5; if (playerState.reserveAmmo < 20) { playerState.reserveAmmo = Math.min(20, playerState.reserveAmmo + 4); updateAmmoUI(); } }
  } else {
    if (playerState.ammo < playerState.maxAmmo) refilling = true;
    playerState.refillAccumulator += dt;
    while (playerState.refillAccumulator >= 1) { playerState.refillAccumulator -= 1; if (playerState.ammo < playerState.maxAmmo) { playerState.ammo++; updateAmmoUI(); } }
  }
  const reloadEl = document.getElementById('reload-indicator');
  if (refilling && playerState.canShoot) { reloadEl.textContent = 'ПОПОЛНЕНИЕ...'; reloadEl.style.color = '#00ff88'; }
  else if (playerState.canShoot) { reloadEl.textContent = 'ГОТОВ'; reloadEl.style.color = '#ffaa00'; }
}
function updateReinforcements(dt) {
  reinforcementTimer += dt;
  if (reinforcementTimer >= REINFORCEMENT_INTERVAL) {
    reinforcementTimer = 0;
    const enemyZones = zones.filter(z => z.owner === 'enemy');
    if (enemyZones.length > 0) {
      const z = enemyZones[Math.floor(Math.random()*enemyZones.length)];
      addHitLog(`Подкрепление противника пришло на зону ${z.name}`);
      spawnEnemy(z);
    }
  }
}

// ---------- PROJECTILES UPDATE ----------
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.life-=dt;
    p.prevPos.copy(p.group.position);
    if(p.isRocket){
      const targetDir = new THREE.Vector3(0,0,1);
      if(p.isPlayer){
        const gun = playerTank.userData.type==='tank' ? playerTank.userData.gunGroup : playerTank.userData.launcherGroup;
        targetDir.copy(gun.localToWorld(new THREE.Vector3(0,0,1)).sub(gun.getWorldPosition(new THREE.Vector3())).normalize());
      }
      p.direction.lerp(targetDir.clone(), 0.5).normalize();
    }
    p.group.position.addScaledVector(p.direction, p.speed*dt);
    p.group.lookAt(p.group.position.clone().add(p.direction));
    if(p.group.position.y < getHeight(p.group.position.x, p.group.position.z)){
      spawnParticles(p.group.position,15,0xbb9977,1.5,0.8); sfx.hit(); removeProjectile(i); continue;
    }
    // Buildings
    {
      const segA2 = p.prevPos, segB2 = p.group.position;
      const segLen2 = segA2.distanceTo(segB2);
      const subSteps2 = Math.max(2, Math.ceil(segLen2 / 1.5));
      let bHit = null;
      const _a2 = new THREE.Vector3(), _b2 = new THREE.Vector3(), _dir2 = new THREE.Vector3();
      for (let s = 0; s < subSteps2; s++) {
        const t0 = s / subSteps2, t1 = (s + 1) / subSteps2;
        _a2.lerpVectors(segA2, segB2, t0); _b2.lerpVectors(segA2, segB2, t1);
        _dir2.copy(_b2).sub(_a2); const dLen2 = _dir2.length();
        if (dLen2 < 0.001) continue;
        _dir2.normalize();
        const subRay2 = new THREE.Raycaster(_a2, _dir2, 0, dLen2 + 0.3);
        const subHits2 = subRay2.intersectObjects(buildingMeshes, false);
        if (subHits2.length) { bHit = subHits2[0]; break; }
      }
      if(bHit){ spawnParticles(bHit.point.clone(), 10, 0xffaa00, 0.5, 0.5); sfx.hit(); removeProjectile(i); continue; }
    }
    // Собираем список целей.
    // Для снаряда игрока — включая чужих игроков (у них есть sessionId).
    const targets = [];
    if (p.isPlayer) {
      for (const sid in mpOtherPlayers) {
        const op = mpOtherPlayers[sid];
        if (op && op.mesh) targets.push({ obj: op.mesh, sessionId: sid, isRemote: true });
      }
      for (const t of enemyTanks) targets.push({ obj: t, sessionId: null, isRemote: false });
      for (const t of destroyedTanks) targets.push({ obj: t, sessionId: null, isRemote: false });
    } else {
      if (playerTank) targets.push({ obj: playerTank, sessionId: null, isRemote: false });
      for (const t of destroyedTanks) targets.push({ obj: t, sessionId: null, isRemote: false });
    }

    let hit = false;
    for(const entry of targets){
      const target = entry.obj;
      if(target === playerTank && p.isPlayer) continue;
      const segA = p.prevPos, segB = p.group.position;
      const segLen = segA.distanceTo(segB);
      const subSteps = Math.max(2, Math.ceil(segLen / 1.5));
      let intersects = null;
      {
        // Суб-шаги по 0.6 u — в 2.5 раза плотнее, чем было.
        // Так быстрые снаряды не «проскакивают» мимо тонких мешей.
        const _subSteps = Math.max(3, Math.ceil(segLen / 0.6));
        const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _dir = new THREE.Vector3();
        for (let s = 0; s < _subSteps; s++) {
          const t0 = s / _subSteps, t1 = (s + 1) / _subSteps;
          _a.lerpVectors(segA, segB, t0); _b.lerpVectors(segA, segB, t1);
          _dir.copy(_b).sub(_a); const dLen = _dir.length();
          if (dLen < 0.001) continue;
          _dir.normalize();
          const subRay = new THREE.Raycaster(_a, _dir, 0, dLen + 0.6);
          const subHits = subRay.intersectObjects(target.userData.allHitMeshes, false);
          if (subHits.length) { intersects = subHits; break; }
        }
        // Fallback: если ни один суб-луч не дал пересечения, но сам отрезок
        // проходит через bbox цели — считаем попаданием. Это ловит случаи,
        // когда снаряд уже внутри меша (луч выходит наружу, Raycaster молчит).
        if (!intersects) {
          let bbox = target.userData._worldBBox;
          if (!bbox) { bbox = new THREE.Box3(); target.userData._worldBBox = bbox; }
          bbox.setFromObject(target);
          const dir = segB.clone().sub(segA);
          const segLen2 = dir.length();
          if (segLen2 > 0.001) {
            dir.normalize();
            const ray = new THREE.Ray(segA, dir);
            const point = new THREE.Vector3();
            if (ray.intersectBox(bbox, point)) {
              intersects = [{
                point: point.clone(),
                face: { normal: new THREE.Vector3(0, 1, 0) },
                object: (target.userData.allHitMeshes && target.userData.allHitMeshes[0]) || target
              }];
            }
          }
        }
      }
      if(intersects && intersects.length>0){
        const obj = intersects[0];
        const point = obj.point.clone();
        const normal = obj.face.normal.clone().transformDirection(obj.object.matrixWorld);

        // ===== Снаряд от другого игрока: только визуал, урон придёт через healthUpdate =====
        if (p.isRemote) {
          spawnParticles(point, 8, 0xffaa00, 0.4, 0.3);
          addBulletHole(target, point, normal, obj.object);
          sfx.hit();
          removeProjectile(i);
          hit = true;
          break;
        }

        // ===== Попадание в ЧУЖОГО ИГРОКА =====
        if (entry.isRemote) {
          let attach = obj.object;
          while(attach){ if(attach.name==='hull'||attach.name==='turret'||attach.name==='elevation'||attach.name==='traverse'||attach.name==='launcher') break; attach=attach.parent; }
          const attachName = attach ? attach.name : 'hull';
          const localPoint = attach ? attach.worldToLocal(point.clone()) : new THREE.Vector3();
          const rType = target.userData.type || 'tank';
          const modName = getHitModuleName(obj.object, localPoint, attachName, rType);

          if (p.isMG) {
            // Пулемёт: HP не трогаем, только счётчики попаданий на сервере.
            if (mpRoom) {
              mpRoom.send("mgHit", { targetId: entry.sessionId, module: modName });
              addHitLog(`MG в ${(mpOtherPlayers[entry.sessionId]?.data?.nickname) || 'игрока'}: ${moduleLabels[modName] || 'корпус'}`);
            }
            addBulletHole(target, point, normal, obj.object);
            spawnParticles(point, 4, 0xffcc44, 0.3, 0.25);
            sfx.hit();
            removeProjectile(i);
            hit = true;
            break;
          }

          spawnParticles(point, 8, 0xffaa00, 0.4, 0.3);
          addBulletHole(target, point, normal, obj.object);
          sfx.hit();
          if (mpRoom) {
            const baseDmg = p.isRocket ? 40 : (p.isAutocannon ? 5 : 20);
            mpRoom.send("hit", {
              targetId: entry.sessionId,
              damage: baseDmg,
              module: modName,
              isRocket: p.isRocket || false,
              isAutocannon: p.isAutocannon || false
            });
            addHitLog(`Попадание в ${(mpOtherPlayers[entry.sessionId]?.data?.nickname) || 'игрока'}: -${baseDmg} (${moduleLabels[modName] || 'корпус'})`);
          }
          removeProjectile(i);
          hit = true;
          break;
        }

        if (target === playerTank && obj.object.name === 'mgMesh' && !playerTank.userData.mgBroken) {
          playerTank.userData.mgBroken = true;
          if (playerTank.userData.mgGroup) playerTank.userData.mgGroup.visible = false;
          spawnParticles(point, 15, 0xffaa00, 0.6, 0.5);
          addHitLog('Пулемёт уничтожен!'); sfx.hit(); removeProjectile(i); hit = true; break;
        }
        let attach = obj.object;
        while(attach){ if(attach.name==='hull'||attach.name==='turret'||attach.name==='elevation'||attach.name==='traverse'||attach.name==='launcher') break; attach=attach.parent; }
        const attachName = attach?attach.name:'hull';
        const localPoint = attach?attach.worldToLocal(point.clone()):new THREE.Vector3();
        const type = target.userData.type||'tank';
        const modName = getHitModuleName(obj.object, localPoint, attachName, type);
        const isDead = target.userData.destroyed;
        if(isDead){ spawnParticles(point,10,0xff6600,0.6,0.4); sfx.hit(); removeProjectile(i); hit = true; break; }

        if(chillMode && target === playerTank) {
          addBulletHole(target, point, normal, obj.object);
          spawnParticles(point,8,0xffaa00,0.4,0.3);
          sfx.hit(); removeProjectile(i); hit = true; break;
        }

        // Ammo rack detonation (tank/ptur only, not BMP)
        if(modName === 'ammoRack' && target.userData.modules?.ammoRack && !target.userData.destroyed && !p.isMG) {
          removeProjectile(i);
          destroyTank(target, true);
          if(target === playerTank) document.getElementById('hint').textContent='ТАНК УНИЧТОЖЕН (детонация БК) | Пробел для рестарта';
          else { playerState.kills++; document.getElementById('kills-val').textContent=playerState.kills; addHitLog('Боекомплект взорван!'); setTimeout(()=>{ if(enemyTanks.length<1) spawnEnemy(); }, 3000); }
          hit = true; break;
        }

        if (target !== playerTank && target.userData.ai) {
          target.userData.alertTimer = 8;
          const hitDir = p.direction.clone().multiplyScalar(-1);
          target.userData.lastHitDir = hitDir;
          target.userData.lastHitTime = 0;
          shareIntelHitDir(hitDir);
          shareIntelPlayerPos(point.clone().addScaledVector(hitDir, 300));
        }

        // MG projectile
        if (p.isMG && target !== playerTank) {
          if (modName === 'leftTrack' || modName === 'rightTrack') {
            target.userData.mgHitTracks = (target.userData.mgHitTracks || 0) + 1;
            addHitLog(`MG: попадание в гусеницу (${target.userData.mgHitTracks}/10)`);
            if (target.userData.mgHitTracks >= 10) {
              if (!target.userData.modules[modName].damaged) { target.userData.modules[modName].damaged = true; applyVisualDamage(target, modName); addHitLog(`MG сломал ${moduleLabels[modName]}`); }
              target.userData.mgHitTracks = 0;
            }
          } else if (modName === 'gun' || modName === 'breech') {
            target.userData.mgHitGun = (target.userData.mgHitGun || 0) + 1;
            addHitLog(`MG: попадание в ствол (${target.userData.mgHitGun}/20)`);
            if (target.userData.mgHitGun >= 20) {
              if (!target.userData.modules.gun.damaged) { target.userData.modules.gun.damaged = true; applyVisualDamage(target, 'gun'); addHitLog(`MG сломал Орудие`); }
              target.userData.mgHitGun = 0;
            }
          }
          addBulletHole(target, point, normal, obj.object);
          spawnParticles(point, 4, 0xffcc44, 0.3, 0.25);
          sfx.hit(); removeProjectile(i); hit = true; break;
        }

        // ---- Damage calculation ----
        // BMP autocannon: 5 dmg to health, 20 dmg to module (5 hits to break 100 HP module), no penalty on repeat.
        const baseDmg = p.isAutocannon ? 5 : (p.isRocket ? 40 : 20);
        const module = target.userData.modules?.[modName];
        let effectiveDmg = baseDmg;
        if(!p.isAutocannon && module && (module.damaged || module.destroyed)){
          const penalty = (modName==='engine'||modName==='transmission'||modName==='radiator') ? 10 : 4;
          effectiveDmg = Math.max(0, baseDmg - penalty);
        }
        target.userData.health -= effectiveDmg;
        if(target === playerTank && playerState) playerState.health = target.userData.health;

        if (target === playerTank && obj.object.name === 'mgMesh') {
          playerTank.userData.mgBroken = true;
          if (playerTank.userData.mgGroup) playerTank.userData.mgGroup.visible = false;
          addHitLog('Пулемёт уничтожен!');
        }

        if (module) {
          if (p.isRocket && !module.destroyed) {
            module.damaged = true; module.destroyed = true; module.hp = 0;
            applyVisualDamage(target, modName);
            addHitLog(`Ракета уничтожила: ${moduleLabels[modName]}, урон: ${effectiveDmg}`);
          } else if (p.isAutocannon) {
            const wasDamaged = module.damaged;
            applyModuleDamage(target.userData.modules, modName, 20);
            if (!wasDamaged && module.damaged) {
              applyVisualDamage(target, modName);
              addHitLog(`БМП сломала: ${moduleLabels[modName]}, урон: ${effectiveDmg}`);
            } else {
              addHitLog(`БМП в ${moduleLabels[modName]}, урон: ${effectiveDmg}`);
            }
          } else if (module.damaged || module.destroyed) {
            addHitLog(`Повторно в ${moduleLabels[modName]}, урон снижен до ${effectiveDmg}`);
          } else {
            applyModuleDamage(target.userData.modules, modName, 100);
            applyVisualDamage(target, modName);
            addHitLog(`${p.isPlayer?'Враг':'Мы'} потерял: ${moduleLabels[modName]}`);
          }
          if (target === playerTank) updateDamageUI();
        } else {
          addHitLog(`${p.isPlayer?'Мы попали':'Нас зацепило'} (корпус), урон: ${effectiveDmg}`);
        }
        if(target === playerTank){
          updatePlayerHealthUI();
          showDamageDirection(p.direction.clone().multiplyScalar(-1));
        }
        addBulletHole(target, point, normal, obj.object);
        spawnParticles(point, p.isAutocannon?4:8, 0xffaa00, 0.4, 0.3);
        sfx.hit();
        if(target.userData.health <= 0 && !target.userData.destroyed){
          destroyTank(target);
          if(target === playerTank) document.getElementById('hint').textContent='ТЕХНИКА УНИЧТОЖЕНА | Пробел для рестарта';
          else { playerState.kills++; document.getElementById('kills-val').textContent=playerState.kills; addHitLog('УНИЧТОЖЕН!'); setTimeout(()=>{ if(enemyTanks.length<1) spawnEnemy(); }, 3000); }
        }
        removeProjectile(i);
        hit = true; break;
      }
    }
    if(!hit && p.life<=0) removeProjectile(i);
  }
}

function updatePlayerHealthUI(){
  if(!playerState) return;
  const pct = Math.max(0, playerState.health/playerState.maxHealth*100);
  document.getElementById('health-bar-inner').style.width = pct+'%';
  document.getElementById('health-text').textContent = Math.round(pct)+'%';
}

// ---------- REPAIR SYSTEM ----------
const MOBILITY_MODULES_TANK = ['engine','transmission','leftTrack','rightTrack'];
const MOBILITY_MODULES_BMP  = ['engine','transmission','leftTrack','rightTrack'];
const MOBILITY_MODULES_PTUR = ['engine','radiator','wheelFL','wheelFR','wheelML','wheelMR','wheelRL','wheelRR'];
const COMBAT_MODULES_TANK   = ['gun','breech','turretTraverse','gunElevation','ammoRack'];
const COMBAT_MODULES_BMP    = ['gun','breech','turretTraverse','gunElevation'];
const COMBAT_MODULES_PTUR   = ['launcher'];

function buildRepairQueue(modules, type, priority){
  const mods = getModulesForType(type);
  const damaged = mods.filter(n => modules[n] && (modules[n].damaged || modules[n].destroyed));
  const mobilityList = type==='ptur' ? MOBILITY_MODULES_PTUR : (type==='bmp' ? MOBILITY_MODULES_BMP : MOBILITY_MODULES_TANK);
  const combatList   = type==='ptur' ? COMBAT_MODULES_PTUR   : (type==='bmp' ? COMBAT_MODULES_BMP   : COMBAT_MODULES_TANK);
  const preferList   = priority === 'mobility' ? mobilityList : combatList;
  const fallbackList = priority === 'mobility' ? combatList   : mobilityList;
  return [...damaged.filter(n => preferList.includes(n)), ...damaged.filter(n => fallbackList.includes(n))];
}

let repairStartTimer=0, repairActiveTimer=0, repairTotalTime=0, repairQueue=[], repairStageIndex=0;

function finishRepairModulePlayer(name, type){
  if(!playerState.modules[name]) return;
  playerState.modules[name].damaged = false; playerState.modules[name].destroyed = false; playerState.modules[name].hp = 100;
  updateDamageUI();
  addHitLog(`Модуль отремонтирован: ${moduleLabels[name]}`);
  const ud = playerTank.userData;
  if(type==='tank' || type==='bmp'){
    if(name==='leftTrack') ud.leftTrackMesh.visible = true;
    if(name==='rightTrack') ud.rightTrackMesh.visible = true;
    if(name==='gun' && ud.barrelMesh){
      ud.barrelMesh.scale.z = 1;
      ud.barrelMesh.position.z = type==='bmp' ? 1.4 : 2.4;
      if(ud.muzzleMesh) ud.muzzleMesh.visible = true;
    }
    if(name==='gun' && ud.mgBroken){ ud.mgBroken = false; if(ud.mgGroup) ud.mgGroup.visible = true; }
  } else {
    if(name.startsWith('wheel') && ud.wheels[name]) ud.wheels[name].visible = true;
    if(name==='launcher'){
      ud.launcherGroup.children.forEach(c => c.visible = true);
      ud.elevGroup.children.forEach(c => c.visible = true);
      ud.traverseGroup.children.forEach(c => c.visible = true);
    }
  }
}
function applyEnemyRepairVisual(enemy, name, eType) {
  const ud = enemy.userData;
  if(eType === 'tank' || eType === 'bmp'){
    if(name==='leftTrack'  && ud.leftTrackMesh)  ud.leftTrackMesh.visible  = true;
    if(name==='rightTrack' && ud.rightTrackMesh) ud.rightTrackMesh.visible = true;
    if(name==='gun' && ud.barrelMesh){
      ud.barrelMesh.scale.z = 1;
      ud.barrelMesh.position.z = eType==='bmp' ? 1.4 : 2.4;
      if(ud.muzzleMesh) ud.muzzleMesh.visible = true;
    }
  } else {
    if(name.startsWith('wheel') && ud.wheels[name]) ud.wheels[name].visible = true;
    if(name==='launcher'){
      if(ud.launcherGroup)  ud.launcherGroup.children.forEach(c => c.visible = true);
      if(ud.elevGroup)      ud.elevGroup.children.forEach(c => c.visible = true);
      if(ud.traverseGroup)  ud.traverseGroup.children.forEach(c => c.visible = true);
    }
  }
}

function updateRepair(dt){
  if(!playerState || playerState.health <= 0) return;
  const type = playerState.vehicleType;
  const mods = getModulesForType(type);
  const anyDamaged = mods.some(n => playerState.modules[n] && (playerState.modules[n].damaged || playerState.modules[n].destroyed));
  const repairing = keys['numpad5'] || keys['5'] || keys['e'];
  const hintEl = document.getElementById('repair-hint');

  if(anyDamaged){
    if(repairQueue.length === 0){
      if(repairing){
        repairStartTimer += dt;
        if(repairStartTimer >= 2.0){
          repairQueue = buildRepairQueue(playerState.modules, type, repairPriority);
          if(repairQueue.length > 0){
            repairStageIndex = 0; repairActiveTimer = 0;
            repairTotalTime = 20 + Math.max(0, repairQueue.length - 1) * 10;
            repairStartTimer = 0;
            addHitLog(`Ремонт: ${moduleLabels[repairQueue[0]]} (${repairTotalTime}с)`);
          }
        }
      } else repairStartTimer = 0;
    } else {
      repairActiveTimer += dt;
      while(repairStageIndex < repairQueue.length && repairActiveTimer >= 20 + repairStageIndex * 10){
        finishRepairModulePlayer(repairQueue[repairStageIndex], type);
        repairStageIndex++;
      }
      if(repairStageIndex >= repairQueue.length){
        repairQueue = []; repairStageIndex = 0; repairActiveTimer = 0; repairTotalTime = 0;
        if(hintEl) hintEl.textContent = '';
      } else {
        if(hintEl) hintEl.textContent = `Ремонт: ${repairActiveTimer.toFixed(1)}с / ${repairTotalTime.toFixed(1)}с — ${moduleLabels[repairQueue[repairStageIndex]]}`;
      }
    }
    if(repairQueue.length === 0 && hintEl){
      if(repairStartTimer > 0) hintEl.textContent = `Ремонт начнётся через ${(2.0 - repairStartTimer).toFixed(1)}с...`;
      else hintEl.textContent = 'Зажмите E (2 сек) для ремонта';
    }
  } else {
    repairStartTimer = 0; repairActiveTimer = 0; repairQueue = []; repairStageIndex = 0; repairTotalTime = 0;
    if(hintEl) hintEl.textContent = '';
  }

  for(const enemy of enemyTanks){
    if(enemy.userData.destroyed) continue;
    const eType = enemy.userData.type||'tank';
    const eMods = getModulesForType(eType);
    const cls = enemy.userData.aiClass || 'normal';
    const damagedList = eMods.filter(n => enemy.userData.modules[n] && (enemy.userData.modules[n].damaged || enemy.userData.modules[n].destroyed));
    if(!damagedList.length){
      enemy.userData.repairState = 'idle'; enemy.userData.repairTimer = 0; enemy.userData.coverTarget = null;
      continue;
    }
    const mobilityList = eType==='ptur' ? MOBILITY_MODULES_PTUR : (eType==='bmp' ? MOBILITY_MODULES_BMP : MOBILITY_MODULES_TANK);
    const mobilityBroken = damagedList.some(n => mobilityList.includes(n));
    const combatBroken = damagedList.some(n => !mobilityList.includes(n));
